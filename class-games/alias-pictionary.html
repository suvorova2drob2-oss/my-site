<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirect…</title>
  <script>
    (function () {
      var u = new URL(window.location.href);
      var mode = u.searchParams.get("mode");
      u.searchParams.delete("mode");
      var qs = u.search || "";
      var hash = u.hash || "";
      if (mode === "pict") {
        window.location.replace("pictionary.html" + qs + hash);
      } else {
        window.location.replace("alias.html" + qs + hash);
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting… <a id="fallback" href="alias.html">Alias</a> · <a href="pictionary.html">Pictionary</a></p>
</body>
</html>
