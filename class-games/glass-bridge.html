<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass bridge · Class games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/mastering-b2-back-link.css" />
  <link rel="stylesheet" href="../css/fce-glass-bridge.css?v=5" />
</head>
<body class="gb-body">
  <div class="gb-app">
    <header class="gb-chrome">
      <div class="gb-chrome-left" id="gbNav"></div>
      <div class="gb-chrome-mid">
        <span class="gb-tag" id="gbTag">Class games</span>
        <h1 class="gb-title">Glass bridge</h1>
      </div>
      <div class="gb-chrome-right">
        <nav class="gb-mode-tabs" id="gbModeTabs" aria-label="Game mode">
          <button type="button" class="gb-mode-tab is-active" data-mode="pick">Pick glass</button>
          <button type="button" class="gb-mode-tab" data-mode="type">Type answer</button>
        </nav>
      </div>
    </header>

    <p class="gb-lead" id="gbLead">Loading…</p>
    <p class="gb-placeholder-banner" id="gbPlaceholderBanner" hidden></p>
    <p class="gb-empty" id="gbEmptyMsg"></p>

    <nav class="gb-pack-tabs" id="gbPackTabs" aria-label="Vocabulary deck" hidden></nav>
    <p class="gb-deck-meta" id="gbDeckMeta" hidden></p>

    <div class="gb-main">
      <div class="gb-hud">
        <div class="gb-progress" id="gbProgress" aria-hidden="true"></div>
        <p class="gb-step-k" id="gbStepLabel">Step 1 / 10</p>
      </div>

      <p class="gb-qline" id="gbQline">Tap left or right glass to see the task.</p>

      <div class="gb-scene" id="gbScene">
        <div class="gb-scene-sky"></div>
        <div class="gb-scene-bridge" id="gbBridgeTrail"></div>
        <div class="gb-scene-row" id="gbGlassRow">
          <button type="button" class="gb-panel gb-panel--left" id="gbPanelL" aria-label="Left glass">
            <span class="gb-panel-mark" aria-hidden="true">◆</span>
          </button>
          <button type="button" class="gb-panel gb-panel--right" id="gbPanelR" aria-label="Right glass">
            <span class="gb-panel-mark" aria-hidden="true">◆</span>
          </button>
        </div>
        <div class="gb-jumper" id="gbJumper" aria-hidden="true">
          <span class="gb-jumper-icon">▲</span>
        </div>
        <div class="gb-abyss"></div>
        <div class="gb-crack" id="gbCrack" hidden aria-hidden="true"></div>
      </div>

      <div class="gb-type-block" id="gbTypeBlock" hidden>
        <div class="gb-type-row">
          <input type="text" id="gbTypeInput" class="gb-type-input" placeholder="Type the missing chunk…" autocomplete="off" spellcheck="false" maxlength="80" aria-label="Your answer" />
          <button type="button" class="gb-btn gb-btn--pri" id="gbTypeCheck">Check</button>
        </div>
      </div>

      <p class="gb-msg" id="gbMsg"></p>

      <div class="gb-bar">
        <button type="button" class="gb-btn" id="gbBtnHint">Hint · text</button>
        <button type="button" class="gb-btn" id="gbBtnRetry">From step 1</button>
      </div>
    </div>

    <details class="gb-rules-fold">
      <summary>Rules</summary>
      <p class="gb-en" id="gbRulesText"></p>
    </details>
  </div>

  <div class="gb-overlay" id="gbOvWin">
    <div class="gb-card gb-card--win">
      <p class="gb-ov-k">Finish</p>
      <h2>You crossed the bridge</h2>
      <p id="gbWinText">All steps clear.</p>
      <button type="button" class="gb-btn gb-btn--pri" id="gbBtnAgain">Play again</button>
    </div>
  </div>

  <div class="gb-overlay" id="gbOvReveal">
    <div class="gb-card gb-card--reveal">
      <p class="gb-ov-k">Not quite</p>
      <h2>Correct answer</h2>
      <p class="gb-reveal-ans" id="gbRevealAns"></p>
      <p class="gb-reveal-note" id="gbRevealNote">Glass breaks — you start again from step 1.</p>
      <button type="button" class="gb-btn gb-btn--pri" id="gbBtnRevealNext">Next → restart</button>
    </div>
  </div>

  <div class="gb-modal" id="gbHintModal">
    <div class="gb-m-in">
      <div class="gb-m-hd"><span id="gbHintTitle">&mdash;</span><button type="button" class="gb-m-close" id="gbHintClose" title="Close" aria-label="Close">&times;</button></div>
      <div id="gbHintFrameWrap"><iframe id="gbHintFrame" title="Source text"></iframe></div>
      <div class="gb-hint-body" id="gbHintBody" hidden></div>
    </div>
  </div>

  <script src="../js/fce-class-games-boards-fallback.js"></script>
  <script src="../js/fce-class-games-boards-registry.js"></script>
  <script src="../js/fce-glass-bridge-engine.js?v=5"></script>
  <script src="../js/fce-class-games-glass-page.js?v=5"></script>
</body>
</html>
