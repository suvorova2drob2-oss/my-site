<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100 to 1 · Class games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/mastering-b2-back-link.css" />
  <link rel="stylesheet" href="../css/fce-hundred-to-one.css?v=4" />
</head>
<body class="h1-body">
  <div class="h1-stage">
    <header class="h1-chrome">
      <div class="h1-chrome-left" id="h1Nav"></div>
      <div class="h1-chrome-mid">
        <span class="h1-tag" id="h1Tag">Class games</span>
        <h1 class="h1-title">100 to 1</h1>
      </div>
      <div class="h1-chrome-right">
        <span class="h1-round" id="h1RoundLbl">Round 1 / —</span>
      </div>
    </header>

    <p class="h1-placeholder-banner" id="h1PlaceholderBanner" hidden></p>
    <p class="h1-msg h1-msg--empty" id="h1EmptyMsg"></p>

    <div class="h1-scorebar">
      <div class="h1-team h1-t-a" id="h1TeamA"><span class="h1-l">Team A</span> <span class="h1-p" id="h1ScoreA">0</span></div>
      <div class="h1-team h1-t-b" id="h1TeamB"><span class="h1-l">Team B</span> <span class="h1-p" id="h1ScoreB">0</span></div>
    </div>

    <nav class="h1-pack-tabs" id="h1PackTabs" aria-label="Vocabulary deck" hidden></nav>
    <p class="h1-deck-meta" id="h1DeckMeta" hidden></p>

    <div class="h1-qbox">
      <div class="h1-q-topic" id="h1QTopic">&mdash;</div>
      <p class="h1-q-text" id="h1QText">&mdash;</p>
    </div>

    <div class="h1-main">
      <section class="h1-board-col">
        <div class="h1-board">
          <h3 class="h1-panel-k">Board</h3>
          <div class="h1-board-rows" id="h1BoardRows"></div>
        </div>
        <p class="h1-msg" id="h1LineMsg"></p>
        <div class="h1-bar">
          <button type="button" class="h1-btn" id="h1BtnText">Hint</button>
          <button type="button" class="h1-btn h1-btn--gold" id="h1BtnNext">Next round</button>
          <button type="button" class="h1-btn" id="h1BtnReset">Reset</button>
        </div>
      </section>
      <section class="h1-pool-col">
        <div class="h1-pool">
          <h3 class="h1-panel-k">Pick a card</h3>
          <p class="h1-hint2" id="h1TurnHint">&mdash;</p>
          <div class="h1-pool-grid" id="h1Pool"></div>
        </div>
      </section>
    </div>

    <details class="h1-rules-fold">
      <summary>How to play</summary>
      <p class="h1-en" id="h1Lead">Loading…</p>
    </details>
  </div>

  <div class="h1-modal" id="h1HintModal" role="dialog" aria-modal="true">
    <div class="h1-hint-panel">
      <div class="h1-hint-panel-hd">
        <h3 id="h1HintTitle">Text</h3>
        <button type="button" class="h1-hint-close" id="h1HintClose" title="Close" aria-label="Close">&times;</button>
      </div>
      <div class="h1-hint-frame-wrap" id="h1HintFrameWrap"><iframe id="h1HintFrame" title="Source text"></iframe></div>
      <div class="h1-hint-body" id="h1HintBody" hidden></div>
      <p class="h1-hint-foot" id="h1HintFoot"></p>
    </div>
  </div>

  <script src="../js/fce-class-games-boards-fallback.js"></script>
  <script src="../js/fce-class-games-boards-registry.js"></script>
  <script src="../js/fce-hundred-to-one-engine.js"></script>
  <script src="../js/fce-class-games-hundred-page.js?v=3"></script>
</body>
</html>
