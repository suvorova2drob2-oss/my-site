<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit 2 &middot; Listening Part 2 &mdash; Into the wilderness (CPE Prep)</title>
  <style>
    :root {
      --panel: #1d2b4a;
      --panel-soft: #223657;
      --line: #324a71;
      --text: #e8f0ff;
      --muted: #9bb0d3;
      --accent: #56ccf2;
      --violet: #c4b5fd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(180deg, #09122a 0%, #101d3c 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }
    .page {
      width: min(920px, 100%);
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .top h1 { font-size: 1.28rem; line-height: 1.3; max-width: 34rem; }
    .back { color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
    .back:hover { text-decoration: underline; }
    .kicker {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--violet);
      margin-bottom: 8px;
    }
    .instr {
      font-size: 0.94rem;
      line-height: 1.6;
      color: #c5d4ef;
      margin-bottom: 18px;
    }
    .audio-card {
      border: 2px dashed var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      background: var(--panel-soft);
      margin-bottom: 20px;
    }
    .audio-card label {
      display: block;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .audio-card p {
      font-size: 0.88rem;
      line-height: 1.5;
      color: var(--muted);
      margin: 0;
    }
    .audio-card audio { width: 100%; margin-top: 10px; }
    .task-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fef08a;
      margin-bottom: 16px;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      background: var(--panel-soft);
      margin-bottom: 12px;
    }
    .item:last-child { margin-bottom: 0; }
    .item__n {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .item__sent {
      font-size: 0.94rem;
      line-height: 1.75;
    }
    .gap-inp {
      display: inline-block;
      vertical-align: baseline;
      min-width: 7rem;
      max-width: 100%;
      margin: 0 3px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 2px dashed #4a6898;
      background: rgba(8, 22, 48, 0.55);
      color: #bae6fd;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .gap-inp:focus {
      outline: none;
      border-color: var(--accent);
      border-style: solid;
      box-shadow: 0 0 0 2px rgba(86, 204, 242, 0.25);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-reset {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .note {
      margin-top: 14px;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div>
        <p class="kicker">Listening &middot; Part 2 &middot; Sentence completion</p>
        <h1>Into the wilderness</h1>
      </div>
      <a class="back" id="back-link" data-u2-vocab-hub-depth="1" data-u2-levels-depth="3" href="../index.html?course=cpe&amp;backLabel=Listening%20%E2%80%94%20Level%202">&larr; Listening</a>
    </header>

    <section class="audio-card" id="audio-section">
      <label for="track-audio">Audio &mdash; <span id="track-label">Track 2.1</span></label>
      <p id="audio-pending">Audio file not uploaded yet. Complete the sentences while you wait; playback will be added when the track is ready.</p>
      <audio id="track-audio" controls preload="none" hidden></audio>
    </section>

    <p class="instr" id="page-instr"></p>
    <p class="task-title">Into the wilderness</p>

    <div id="items" class="items"></div>

    <div class="toolbar">
      <button type="button" class="btn btn-reset" id="btn-reset">Clear answers</button>
    </div>
    <p class="note">Answer check will be enabled when the audio and official key are added.</p>
  </main>

  <script src="../../../js/u2-vocab-course-context.js"></script>
  <script src="../../../js/prep-course-profile.js"></script>
  <script src="../../../js/unit2-listening-part2-wilderness-data.js"></script>
  <script src="../../../js/prep-hub-unit2-nests.js"></script>
  <script>
(function () {
  "use strict";

  var pack = window.U2_LISTENING_PART2_WILDERNESS;
  if (!pack) return;

  var instr = document.getElementById("page-instr");
  if (instr && pack.instructionHtml) instr.innerHTML = pack.instructionHtml;

  var trackLabel = document.getElementById("track-label");
  if (trackLabel && pack.trackLabel) trackLabel.textContent = pack.trackLabel;

  var audioSection = document.getElementById("audio-section");
  var audioPending = document.getElementById("audio-pending");
  var audio = document.getElementById("track-audio");
  if (pack.audioSrc && audio) {
    audio.src = pack.audioSrc;
    audio.hidden = false;
    if (audioPending) audioPending.style.display = "none";
    if (audioSection) audioSection.style.borderStyle = "solid";
  }

  var elItems = document.getElementById("items");
  if (elItems && Array.isArray(pack.items)) {
    elItems.innerHTML = pack.items
      .map(function (it) {
        return (
          '<article class="item">' +
          '<div class="item__n">' + it.n + "</div>" +
          '<p class="item__sent">' + it.html + "</p>" +
          "</article>"
        );
      })
      .join("");
  }

  document.getElementById("btn-reset").addEventListener("click", function () {
    (pack.gapIds || []).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = "";
    });
  });

  var back = document.getElementById("back-link");
  if (back) {
    var params = new URLSearchParams(location.search);
    if (params.get("course") === "cpe" || params.get("prep_stay") === "1") {
      var folderId =
        typeof PREP_LEGACY_U2_LISTENING_FOLDER_ID !== "undefined"
          ? PREP_LEGACY_U2_LISTENING_FOLDER_ID
          : "prep_legacy_u2_listening";
      back.href =
        "../../../index.html?prep_stay=1&screen=unit2&prep_open_folder=" +
        encodeURIComponent(folderId);
      var lbl = params.get("backLabel");
      back.textContent = lbl ? "\u2190 " + lbl : "\u2190 Listening \u00b7 Level 2";
    }
  }
})();
  </script>
</body>
</html>
