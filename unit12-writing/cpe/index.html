<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Writing &mdash; Unit 12 (CPE Prep)</title>
  <style>
    :root {
      --panel: #1d2b4a;
      --panel-soft: #223657;
      --line: #324a71;
      --text: #e8f0ff;
      --muted: #9bb0d3;
      --accent: #56ccf2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(180deg, #09122a 0%, #101d3c 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .page {
      width: min(920px, 100%);
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }
    .top h1 { font-size: 1.3rem; }
    .back { color: var(--accent); text-decoration: none; font-weight: 600; }
    .back:hover { text-decoration: underline; }
    .lead { color: var(--muted); font-size: 0.94rem; line-height: 1.5; margin-bottom: 18px; }
    .task-card {
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      background: var(--panel-soft);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .task-card:hover { border-color: #4a6898; transform: translateY(-2px); }
    .task-card h2 { font-size: 1.05rem; margin-bottom: 8px; color: #bae6fd; }
    .task-card p { font-size: 0.9rem; color: var(--muted); line-height: 1.45; }
    .task-card .go { margin-top: 10px; color: var(--accent); font-weight: 700; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>Writing &mdash; Unit 12</h1>
      <a class="back" id="back-link" href="../../index.html?prep_stay=1&amp;screen=unit12&amp;prep_open_folder=prep_legacy_u12_writing">&larr; Level 12</a>
    </header>
    <p class="lead">CPE Prep &mdash; Writing Part 2 &middot; one page (Exercises 1&ndash;4).</p>

    <a class="task-card" href="informal-letter-exercise-1/index.html?course=cpe&amp;backLabel=Writing%20%E2%80%94%20Level%2012">
      <h2>Part 2 &mdash; Informal letter (mental health)</h2>
      <p>Task analysis &middot; model answer &middot; Ex 3 idioms &middot; Ex 4 grammar</p>
      <span class="go">Open &rarr;</span>
    </a>
  </main>
  <script>
(function () {
  var p = new URLSearchParams(location.search);
  if (p.get("course") === "cpe" || p.get("prep_stay") === "1") {
    location.replace(
      "informal-letter-exercise-1/index.html?course=cpe&backLabel=" +
      encodeURIComponent("Writing — Level 12")
    );
  }
  var back = document.getElementById("back-link");
  if (!back) return;
  var p = new URLSearchParams(location.search);
  if (p.get("course") === "cpe" || p.get("prep_stay") === "1") {
    back.href =
      "../../index.html?prep_stay=1&screen=unit12&prep_open_folder=" +
      encodeURIComponent("prep_legacy_u12_writing");
    var lbl = p.get("backLabel");
    if (lbl) back.textContent = "\u2190 " + lbl;
  }
})();
  </script>
</body>
</html>
