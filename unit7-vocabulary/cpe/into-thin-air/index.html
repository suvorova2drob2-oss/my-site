<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Level 7 &mdash; Into thin air (CPE Prep)</title>
  <script src="../../../js/prep-track-scope.js" data-track="cpe"></script>
  <link rel="stylesheet" href="../../../css/cpe-prep-vocab-pick-shell.css" />
</head>
<body class="cpe-vocab-body">
  <main class="cpe-vocab-page">
    <header class="cpe-vocab-top">
      <a class="cpe-vocab-back" id="u7-back-link" href="../index.html?course=cpe&amp;backLabel=Vocabulary%20%E2%80%94%20Level%207">&larr; Vocabulary &mdash; Level 7</a>
      <h1>Into thin air</h1>
      <p class="cpe-vocab-meta">Level 7 &middot; Vocabulary &middot; Part 1</p>
    </header>

    <p class="cpe-vocab-instr">Choose the correct word in each pair. Then <strong>Submit</strong> to see why each answer fits.</p>

    <div class="cpe-vocab-split" id="cpe-vocab-split">
      <div class="cpe-vocab-main">
        <div class="cpe-vocab-block">
          <div class="cpe-vocab-passage" id="passage"></div>
        </div>
        <div class="cpe-vocab-btn-row">
          <button type="button" class="cpe-vocab-btn-check" id="btn-check">Submit</button>
          <button type="button" class="cpe-vocab-btn-reset" id="btn-reset">Reset</button>
        </div>
      </div>
      <aside class="cpe-vocab-aside" id="feedback" aria-live="polite" hidden></aside>
    </div>

    <p class="cpe-vocab-sibling"><a href="../correct-option/index.html?course=cpe&amp;backLabel=Vocabulary%20%E2%80%94%20Level%207">Part 2 &middot; Correct option &rarr;</a></p>
  </main>

  <script>
(function () {
  var ITEMS = [
    {
      id: 1,
      a: "baffled",
      b: "deluded",
      ans: "baffled",
      why:
        "<strong>Baffled</strong> = completely puzzled by the story. <em>Deluded</em> means believing something false about yourself &mdash; the public is confused, not self-deceived.",
      notOther:
        "<span class=\"fb-not\">✗ <em>Deluded</em> needs a person who believes a false idea (e.g. deluding themselves), not &ldquo;everyone is deluded by the news&rdquo; in this sense.</span>"
    },
    {
      id: 2,
      a: "double-crossed",
      b: "confounded",
      ans: "confounded",
      why:
        "<strong>Confounded</strong> = left the detectives thoroughly puzzled. <em>Double-crossed</em> is what a person does to someone else (betrayal), not what a mystery does to investigators.",
      notOther:
        "<span class=\"fb-not\">✗ Detectives are not &ldquo;double-crossed&rdquo; by a case &mdash; people double-cross people.</span>"
    },
    {
      id: 3,
      a: "perplexed",
      b: "bluffing",
      ans: "perplexed",
      why:
        "<strong>Perplexed</strong> = he was puzzled to find the spinning bike and no friend. <em>Bluffing</em> would mean Porter was pretending / lying, not his reaction to the discovery.",
      notOther:
        "<span class=\"fb-not\">✗ He is not &ldquo;bluffing to discover&rdquo; &mdash; bluffing is deceiving, not being confused.</span>"
    },
    {
      id: 4,
      a: "deluding",
      b: "duping",
      ans: "deluding",
      why:
        "<strong>Deluding themselves</strong> is the fixed pattern (= making themselves believe something untrue). <em>Duping</em> usually takes an object (<em>dupe someone</em>), not <em>dupe themselves</em> here.",
      notOther:
        "<span class=\"fb-not\">✗ <em>Duping themselves</em> is less natural than <em>deluding themselves</em> after &ldquo;anyone who thinks&hellip;&rdquo;</span>"
    },
    {
      id: 5,
      a: "confounded",
      b: "double-crossed",
      ans: "double-crossed",
      why:
        "<strong>Double-crossed</strong> a business partner = betrayed them in a deal. <em>Confounded</em> does not collocate with &ldquo;a former business partner&rdquo; as the object of his action.",
      notOther:
        "<span class=\"fb-not\">✗ You confound <em>people</em> (puzzle them), you do not &ldquo;confound a partner&rdquo; in a business-crime sense.</span>"
    },
    {
      id: 6,
      a: "scammed",
      b: "bluffed",
      ans: "scammed",
      why:
        "<strong>Scammed them out of money</strong> is the natural collocation for fraud. <em>Bluffed</em> does not take <em>them out of money</em> &mdash; you bluff in poker or bluff that something is true.",
      notOther:
        "<span class=\"fb-not\">✗ <em>Bluffed them out of money</em> is not standard English for financial fraud.</span>"
    },
    {
      id: 7,
      a: "baffling",
      b: "bluffing",
      ans: "bluffing",
      why:
        "<strong>Bluffing</strong> = pretending not to know / hiding the truth. <em>Baffling</em> would mean Porter himself is confusing (&ldquo;a baffling person&rdquo;), not that he might be deceiving reporters.",
      notOther:
        "<span class=\"fb-not\">✗ The question is whether he is <em>pretending</em> ignorance &mdash; that is bluffing, not baffling.</span>"
    },
    {
      id: 8,
      a: "duped",
      b: "perplexed",
      ans: "duped",
      why:
        "<strong>Duped everyone into thinking</strong> = tricked people into believing a false story. <em>Perplexed everyone into thinking</em> is wrong: you perplex people (confuse them), you do not <em>perplex into</em> a belief.",
      notOther:
        "<span class=\"fb-not\">✗ <em>Perplexed</em> cannot combine with <em>into thinking</em> the way <em>duped</em> can.</span>"
    }
  ];

  var picks = {};
  var checked = false;

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function renderPassage() {
    var root = document.getElementById("passage");
    var html =
      '<p class="story-title">Into thin air</p>' +
      '<p>Everyone is ' +
      gapHtml(1) +
      " by a recent news story. A wealthy businessman has apparently disappeared into thin air, which has " +
      gapHtml(2) +
      " detectives looking into the case.</p>" +
      "<p>John Porter had been on a bike ride in the rolling hills of Devon when his business associate and friend, the victim, Daniel Keen, went missing. Upon turning into a country lane, Mr Porter noticed Mr Keen hadn&rsquo;t followed him. Backtracking, he was " +
      gapHtml(3) +
      " to discover Mr Keen&rsquo;s bike with the wheels still in motion 50 metres up the road, but no sign of his friend.</p>" +
      "<p>Speaking to reporters, Mr Porter said, &lsquo;Anyone who thinks a car picked him up is " +
      gapHtml(4) +
      " themselves. It was 6 am and very quiet&rsquo;. There has been speculation about Mr Keen&rsquo;s reputation. Had he " +
      gapHtml(5) +
      " a former business partner, or " +
      gapHtml(6) +
      " them out of money? Could Mr Porter be " +
      gapHtml(7) +
      " and actually know more than he&rsquo;s letting on? Could Mr Keen himself have set it up and " +
      gapHtml(8) +
      " everyone into thinking he had been the victim of a crime?</p>" +
      '<p class="tagline">The plot thickens!</p>';
    root.innerHTML = html;

    root.querySelectorAll(".pick-opt").forEach(function (btn) {
      btn.addEventListener("click", onPick);
    });
  }

  function gapHtml(id) {
    var it = ITEMS[id - 1];
    return (
      '<span class="pick" data-gap="' +
      id +
      '"><span class="gap-num">(' +
      id +
      ')</span>' +
      '<button type="button" class="pick-opt" data-gap="' +
      id +
      '" data-word="' +
      it.a +
      '">' +
      esc(it.a) +
      "</button>" +
      '<span class="pick-sep">or</span>' +
      '<button type="button" class="pick-opt" data-gap="' +
      id +
      '" data-word="' +
      it.b +
      '">' +
      esc(it.b) +
      "</button></span>"
    );
  }

  function hideAside() {
    var fb = document.getElementById("feedback");
    var split = document.getElementById("cpe-vocab-split");
    fb.hidden = true;
    fb.innerHTML = "";
    split.classList.remove("cpe-vocab-split--aside-visible");
  }

  function onPick(ev) {
    if (checked) return;
    var btn = ev.currentTarget;
    var gap = Number(btn.getAttribute("data-gap"));
    var word = btn.getAttribute("data-word");
    picks[gap] = word;
    hideAside();
    document.querySelectorAll('.pick-opt[data-gap="' + gap + '"]').forEach(function (b) {
      b.classList.remove("is-picked", "is-ok", "is-bad", "is-dim");
      if (b.getAttribute("data-word") === word) b.classList.add("is-picked");
    });
  }

  function checkAnswers() {
    checked = true;
    var correct = 0;
    var fb = document.getElementById("feedback");
    var parts = [];

    ITEMS.forEach(function (it) {
      var chosen = picks[it.id] || "";
      var ok = chosen === it.ans;
      if (ok) correct += 1;

      var pickEl = document.querySelector('.pick[data-gap="' + it.id + '"]');
      if (pickEl) {
        pickEl.classList.remove("is-ok", "is-bad");
        pickEl.classList.add(ok ? "is-ok" : "is-bad");
      }

      document.querySelectorAll('.pick-opt[data-gap="' + it.id + '"]').forEach(function (b) {
        b.disabled = true;
        var w = b.getAttribute("data-word");
        b.classList.remove("is-picked", "is-ok", "is-bad", "is-dim");
        if (w === it.ans) b.classList.add("is-ok");
        else if (w === chosen && !ok) b.classList.add("is-bad");
        else b.classList.add("is-dim");
      });

      parts.push(
        '<div class="fb-item ' +
          (ok ? "ok" : "bad") +
          '"><h4>(' +
          it.id +
          ") " +
          (ok ? "Correct" : "Not quite") +
          " &mdash; <strong>" +
          esc(it.ans) +
          "</strong>" +
          (chosen && !ok ? " (you chose <em>" + esc(chosen) + "</em>)" : "") +
          '</h4><p class="fb-why">' +
          it.why +
          it.notOther +
          "</p></div>"
      );
    });

    fb.innerHTML =
      '<p class="fb-summary">Score: ' +
      correct +
      " / " +
      ITEMS.length +
      "</p>" +
      parts.join("");
    fb.hidden = false;
    document.getElementById("cpe-vocab-split").classList.add("cpe-vocab-split--aside-visible");
  }

  function resetAll() {
    checked = false;
    picks = {};
    hideAside();
    renderPassage();
  }

  document.getElementById("btn-check").addEventListener("click", checkAnswers);
  document.getElementById("btn-reset").addEventListener("click", resetAll);
  renderPassage();

})();
  </script>
  <script src="../../../js/u7-vocab-course-context.js"></script>
</body>
</html>
