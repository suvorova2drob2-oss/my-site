    .instr {
      font-size: 0.94rem;

    }
    .text-box {
      border: 1px solid rgba(94, 234, 212, 0.35);
      border-radius: 16px;
      padding: 18px 18px 20px;

<body>
  <main class="page">
    <header class="top">
      <div>
        <h1>Participle clauses &middot; Exercise 2</h1>
        <p class="badge">Language focus &middot; Unit 12</p>
      </div>
      <a class="back" id="back-link" href="../../../index.html?prep_stay=1&amp;screen=unit12">&larr; Grammar &middot; Level 12</a>
    </header>

    <nav class="gram-nav" aria-label="Participle clauses">
      <a href="index.html">Reference A&ndash;C</a>
      <span> &middot; </span>
      <a href="exercise-1-shorten-clauses.html">Exercise 1 &mdash; shorten clauses</a>
      <span> &middot; </span>
      <span style="font-weight:700;color:var(--text);">Exercise 2 &mdash; chocolate text</span>
    </nav>

    <p class="instr"><strong>2</strong> Use a suitable form of the verbs in brackets to complete the text.</p>

    <div class="text-box">
      <p class="text-title">The health benefits of chocolate</p>
      <p class="passage" id="passage"></p>
    </div>

    <div class="btn-row">
      <button type="button" class="btn-check" id="btnCheck">Check answers</button>
      <button type="button" class="btn-reset" id="btnReset">Reset</button>
      <button type="button" class="btn-sol" id="btnSol">Show solution</button>
    </div>
    <p class="feedback" id="feedback"></p>
  </main>

  <script>
(function () {
  var GAPS = [
    { n: 1, verb: "consider", accept: ["considered"], display: "Considered" },
    { n: 2, verb: "eat", accept: ["eaten"], display: "Eaten" },
    { n: 3, verb: "be", accept: ["being"], display: "Being" },
    { n: 4, verb: "deliver", accept: ["delivered"], display: "delivered" },
    { n: 5, verb: "say", accept: ["that said", "having said that"], display: "That said" },
    { n: 6, verb: "lead", accept: ["leading"], display: "leading" },
    { n: 7, verb: "have", accept: ["having had"], display: "Having had" },
    { n: 8, verb: "coat", accept: ["coated"], display: "coated" },
    { n: 9, verb: "outweigh", accept: ["outweighing"], display: "outweighing" }
  ];

  var SEGMENTS = [
    { after: " by many to be a guilty self-indulgence, chocolate isn\u2019t often included in lists of nutritious foods. " },
    { after: " in moderation, however, it in fact offers a wide range of health benefits. " },
    { after: " rich in minerals, including magnesium, zinc and iron, dark chocolate promotes the healthy functioning of vital biological processes. There\u2019s also a lot to be said for the psychological health benefits " },
    { after: " by an occasional pick-me-up \u2013 as long as it doesn\u2019t become a habit. " },
    { after: " that, chocolate is often sweetened with unhealthy amounts of sugar. Milk chocolate also contains high levels of fat, potentially " },
    { after: " to medical problems from obesity to heart disease, so the darker the chocolate, the better. " },
    { after: " all the healthy cocoa solids removed during the production process, white chocolate offers no health benefits whatsoever. What\u2019s more, snacks " },
    { after: " in chocolate may contain potentially damaging substances, with the drawbacks almost certainly " },
    { after: " any health benefits." }
  ];

  function norm(s) {
    return String(s || "")
      .trim()
      .toLowerCase()
      .replace(/\u2019/g, "'")
      .replace(/\s+/g, " ");
  }

  function gapByNum(n) {
    for (var i = 0; i < GAPS.length; i++) {
      if (GAPS[i].n === n) return GAPS[i];
    }
    return null;
  }

  function matchesGap(g, raw) {
    var u = norm(raw);
    if (!u) return false;
    for (var i = 0; i < g.accept.length; i++) {
      if (norm(g.accept[i]) === u) return true;
    }
    return false;
  }

  var passage = document.getElementById("passage");
  var fb = document.getElementById("feedback");
  var btnSol = document.getElementById("btnSol");

  GAPS.forEach(function (g, idx) {
    var seg = SEGMENTS[idx];
    var open = document.createTextNode("(" + g.n + ") ");
    passage.appendChild(open);
    var wrap = document.createElement("span");
    wrap.className = "gap-wrap";
    wrap.innerHTML =
      '<input type="text" class="gap-input" id="gap-' +
      g.n +
      '" autocomplete="off" spellcheck="false" aria-label="Gap ' +
      g.n +
      '" /><span class="verb-hint">(' +
      g.verb +
      ")</span>";
    passage.appendChild(wrap);
    passage.appendChild(document.createTextNode(seg.after));
  });

  GAPS.forEach(function (g) {
    document.getElementById("gap-" + g.n).addEventListener("input", function () {
      this.classList.remove("is-ok", "is-bad");
      fb.textContent = "";
      btnSol.style.display = "none";
    });
  });

  document.getElementById("btnCheck").addEventListener("click", function () {
    var ok = 0;
    var html = "";
    var missing = [];
    GAPS.forEach(function (g) {
      var el = document.getElementById("gap-" + g.n);
      var raw = el.value;
      el.classList.remove("is-ok", "is-bad");
      if (!raw.trim()) {
        missing.push(g.n);
        return;
      }
      var good = matchesGap(g, raw);
      if (good) {
        ok++;
        el.classList.add("is-ok");
      } else {
        el.classList.add("is-bad");
        html +=
          '<p class="fb-line"><strong>' +
          g.n +
          ".</strong> Key: <em>" +
          g.display +
          "</em></p>";
      }
    });
    if (missing.length) {
      fb.textContent = "Fill gap(s): " + missing.join(", ") + ".";
      btnSol.style.display = "none";
      return;
    }
    fb.innerHTML =
      ok === GAPS.length
        ? "<strong>Excellent \u2014 9 / 9.</strong>"
        : "Score: <strong>" + ok + "</strong> / 9." + html;
    btnSol.style.display = ok === GAPS.length ? "none" : "inline-block";
  });

  btnSol.addEventListener("click", function () {
    GAPS.forEach(function (g) {
      var el = document.getElementById("gap-" + g.n);
      el.value = g.display;
      el.classList.add("is-ok");
      el.classList.remove("is-bad");
    });
    fb.textContent = "Solution shown.";
    btnSol.style.display = "none";
  });

  document.getElementById("btnReset").addEventListener("click", function () {
    GAPS.forEach(function (g) {
      var el = document.getElementById("gap-" + g.n);
      el.value = "";
      el.classList.remove("is-ok", "is-bad");
    });
    fb.textContent = "";
    btnSol.style.display = "none";
  });
})();
  </script>
