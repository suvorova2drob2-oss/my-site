<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground · Unit 9 · CPE Prep</title>
  <style>
    :root {
      --panel: #1e293b;
      --line: rgba(148, 163, 184, 0.22);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: radial-gradient(120% 85% at 50% 0%, #111827 0%, #0d1117 50%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .page {
      width: min(720px, 100%);
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 1.35rem;
      line-height: 1.25;
    }
    .tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-top: 6px;
    }
    .back {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .back:hover {
      text-decoration: underline;
    }
    .lead {
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
    }
    .lead strong {
      color: #e2e8f0;
      font-weight: 650;
    }
    .lead a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .lead a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div>
        <p class="tag">CPE Prep · Level 9</p>
        <h1>Playground</h1>
        <p class="tag">Off-scriptbook hub · placeholder</p>
      </div>
      <a class="back" href="../../../index.html?course=cpe">&larr; Levels hub</a>
    </header>
    <p class="lead">
      Level&nbsp;9 formats: use <a href="../unit10/index.html?course=cpe">Unit&nbsp;10 Playground</a> grid until unit-specific decks are wired here.
    </p>
  </main>
</body>
</html>
