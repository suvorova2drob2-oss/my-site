<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleabag Workshop · Session</title>
  <link rel="stylesheet" href="../../b2-summer-intensive/css/intensive-shell.css" />
  <link rel="stylesheet" href="css/fleabag-workshop.css" />
</head>
<body class="intensive-body intensive-body--fleabag">
  <div class="int-shell" id="lesson-root">
    <header class="int-topbar">
      <div class="int-brand">
        <span class="int-kicker">Fleabag Workshop</span>
      </div>
      <a class="int-back" href="index.html">&larr; Sessions</a>
    </header>

    <section class="int-lesson-head fb-lesson-board">
      <div class="fb-lesson-board-top">
        <div class="int-lesson-theme">
          <span class="int-theme-icon" id="lesson-icon" aria-hidden="true">📺</span>
          <div>
            <h1 id="lesson-title">Session</h1>
            <p id="lesson-tag">Tagline</p>
            <p id="lesson-synopsis" class="fb-synopsis" hidden></p>
          </div>
        </div>
        <aside
          id="fb-speak-chip-host"
          class="fb-speak-rail-host fb-speak-rail-host--lesson"
          data-fb-chip-variant="rail"
          aria-label="Speak Club stats"
        ></aside>
      </div>
      <div class="fb-lesson-flow" aria-label="How this episode works">
        <div class="fb-lesson-flow-card">
          <span class="fb-lesson-flow-n">01</span>
          <strong>Clip</strong>
          <em>Watch the beat · 1–2 min</em>
        </div>
        <div class="fb-lesson-flow-card">
          <span class="fb-lesson-flow-n">02</span>
          <strong>Cool words</strong>
          <em>Tape phrases on the side</em>
        </div>
        <div class="fb-lesson-flow-card">
          <span class="fb-lesson-flow-n">03</span>
          <strong>Talk</strong>
          <em>Lexis → Example → Discussion</em>
        </div>
        <div class="fb-lesson-flow-card fb-lesson-flow-card--mic">
          <span class="fb-lesson-flow-n">🎙</span>
          <strong>Speak desk</strong>
          <em>Timed talk · sparks on this device</em>
        </div>
      </div>
      <nav class="int-stepper" id="lesson-stepper" aria-label="Session steps"></nav>
    </section>

    <div id="lesson-stage"></div>

    <footer class="int-nav">
      <button type="button" class="int-btn int-btn--ghost" id="btn-prev">← Previous</button>
      <span class="int-progress-text" id="lesson-progress">Step 1 / 7</span>
      <button type="button" class="int-btn int-btn--primary" id="btn-next">Next step →</button>
    </footer>
  </div>

  <script src="js/fleabag-workshop.js?v=s02e01-2"></script>
  <script src="js/fleabag-phrase-memes.js?v=1"></script>
  <script src="js/fleabag-speak-desk.js?v=1"></script>
  <script src="js/fleabag-phrase-srs.js?v=1"></script>
  <script src="js/fleabag-sticker-fyp.js?v=1"></script>
  <script src="js/fleabag-sticker-swipe.js?v=1"></script>
  <script src="js/fleabag-lesson.js?v=s02e01-meme-1"></script>
</body>
</html>
