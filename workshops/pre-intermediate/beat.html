<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirect · Pre-intermediate</title>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var unit = p.get("unit") || "";
      location.replace(
        "unit.html?theme=" + encodeURIComponent(unit || "jobs")
      );
    })();
  </script>
</head>
<body>
  <p><a href="index.html">← Units</a></p>
</body>
</html>
