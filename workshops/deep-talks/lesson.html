<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Talks · Session</title>
  <link rel="stylesheet" href="../../b2-summer-intensive/css/intensive-shell.css" />
  <link rel="stylesheet" href="css/deep-talks.css" />
</head>
<body class="intensive-body intensive-body--deep-talks">
  <div class="int-shell" id="lesson-root">
    <header class="int-topbar">
      <div class="int-brand">
        <span class="int-kicker">Deep Talks</span>
      </div>
      <a class="int-back" href="index.html">&larr; Series</a>
    </header>

    <section class="int-lesson-head">
      <div class="int-lesson-theme">
        <span class="int-theme-icon" id="lesson-icon" aria-hidden="true">💬</span>
        <div>
          <h1 id="lesson-title">Session</h1>
          <p id="lesson-tag">Tagline</p>
          <p class="dt-lesson-lenses" id="lesson-lenses"></p>
        </div>
      </div>
      <nav class="int-stepper" id="lesson-stepper" aria-label="Session steps"></nav>
    </section>

    <div id="lesson-stage"></div>

    <footer class="int-nav">
      <button type="button" class="int-btn int-btn--ghost" id="btn-prev">← Previous</button>
      <span class="int-progress-text" id="lesson-progress">Step 1 / 7</span>
      <button type="button" class="int-btn int-btn--primary" id="btn-next">Next step →</button>
    </footer>
  </div>

  <script src="js/deep-talks.js"></script>
  <script src="js/deep-talks-lesson.js"></script>
</body>
</html>
