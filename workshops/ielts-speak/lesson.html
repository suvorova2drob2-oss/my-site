<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Speak · Lesson</title>
  <link rel="stylesheet" href="../../b2-summer-intensive/css/intensive-shell.css" />
  <link rel="stylesheet" href="../../b2-summer-intensive/css/summer-intensive.css" />
  <link rel="stylesheet" href="../fleabag/css/fleabag-workshop.css" />
  <link rel="stylesheet" href="css/ielts-speak.css" />
</head>
<body class="intensive-body intensive-body--ielts">
  <script src="../js/workshop-gate.js"></script>
  <script>WorkshopGate.guardPage({ homeHref: "../../b2-intensive.html" });</script>
  <div class="int-shell" id="lesson-root">
    <header class="int-topbar">
      <div class="int-brand">
        <span class="int-kicker">IELTS Speak</span>
      </div>
      <nav class="int-topbar-links" aria-label="Back">
        <a class="int-back" href="index.html" id="int-back-topics">&larr; Topics</a>
      </nav>
    </header>

    <section class="int-lesson-head">
      <div class="int-lesson-theme">
        <span class="int-theme-icon" id="lesson-icon" aria-hidden="true">📘</span>
        <div>
          <h1 id="lesson-title">Lesson</h1>
          <p id="lesson-tag">Theme tagline</p>
          <div class="si-lesson-flow" aria-label="How this lesson works">
            <div class="si-lesson-flow-card">
              <span class="si-lesson-flow-n">01</span>
              <strong>Text</strong>
              <em>Academic article · short read</em>
            </div>
            <div class="si-lesson-flow-card">
              <span class="si-lesson-flow-n">02</span>
              <strong>Cool words</strong>
              <em>Tape phrases on the side</em>
            </div>
            <div class="si-lesson-flow-card">
              <span class="si-lesson-flow-n">03</span>
              <strong>Talk</strong>
              <em>Part 3 · steal stems</em>
            </div>
            <div class="si-lesson-flow-card">
              <span class="si-lesson-flow-n">04</span>
              <strong>Improv</strong>
              <em>Whole tape · finale</em>
            </div>
          </div>
          <details class="si-goal-note" id="si-goal-note">
            <summary>Teacher’s note · lesson goal</summary>
            <div class="si-goal-body" id="si-goal-body"></div>
          </details>
        </div>
      </div>
      <nav class="int-stepper" id="lesson-stepper" aria-label="Lesson steps"></nav>
    </section>

    <div id="lesson-stage"></div>

    <footer class="int-nav">
      <button type="button" class="int-btn int-btn--ghost" id="btn-prev">← Previous</button>
      <span class="int-progress-text" id="lesson-progress">Step 1 / 6</span>
      <button type="button" class="int-btn int-btn--primary" id="btn-next">Next step →</button>
    </footer>
  </div>

  <script src="js/ielts-speak-themes.js"></script>
  <script src="../fleabag/js/fleabag-phrase-srs.js"></script>
  <script src="../fleabag/js/fleabag-sticker-fyp.js"></script>
  <script src="../fleabag/js/fleabag-sticker-swipe.js"></script>
  <script src="../../b2-summer-intensive/js/intensive-lesson.js"></script>
  <script>
    (function () {
      if (document.title && /B2 Intensive/i.test(document.title)) {
        document.title = document.title.replace(/B2 Intensive/i, "IELTS Speak");
      }
      var params = new URLSearchParams(window.location.search);
      var themeId = params.get("theme") || "";
      var topicId = params.get("topic") || "";
      var theme =
        typeof IELTS_SPEAK_getTheme === "function"
          ? IELTS_SPEAK_getTheme(themeId)
          : null;
      if (!topicId && theme && theme.topicId) topicId = theme.topicId;
      var back = document.getElementById("int-back-topics");
      if (back && topicId) {
        back.href = "topic.html?topic=" + encodeURIComponent(topicId);
        back.innerHTML =
          "&larr; " +
          ((theme && theme.topicTitle) || "Topic");
      }
    })();
  </script>
</body>
</html>
