<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retell check</title>
  <style>
    :root { --bg:#121826; --text:#fff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:14px 16px 20px; line-height:1.55; }
  </style>
  <link rel="stylesheet" href="css/fce-retell-check.css?v=2" />
  <link rel="stylesheet" href="css/unit1-lifestyle-phrases-drawer.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/mastering-b2-page-skin.css" />
</head>
<body>
  <div id="retell-check-root"></div>
  <script src="js/unit1-lifestyle-retell-blocks.js"></script>
  <script src="js/unit1-clothes-retell-blocks.js"></script>
  <script src="js/unit1-lifestyle-lexis.js"></script>
  <script src="js/unit1-clothes-lexis.js"></script>
  <script src="js/fce-cool-phrases-drawer.js"></script>
  <script src="js/fce-u1-cool-phrases-bridge.js"></script>
  <script src="js/fce-retell-check-decks.js"></script>
  <script src="js/fce-retell-check-engine.js"></script>
  <script src="js/mastering-b2-daily-activity.js"></script>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var unit = parseInt(p.get("unit"), 10) || 1;
      var back = p.get("back");
      var backHref = "unit" + unit + "-class-games.html";
      var backLabel = "Class Games";
      if (back === "reading") {
        backHref = "unit1-reading/this-is-your-life/index.html";
        backLabel = "This is your life";
      } else if (back === "vocab") {
        backHref = "unit1-vocabulary/index.html";
        backLabel = "Vocabulary";
      } else if (back === "listening") {
        backHref = "unit1-listening/sb-1-1/part3-multiple-matching.html";
        backLabel = "SB 1.1 · Clothes";
      }
      FCE_RETELL_CHECK.mount({
        root: "#retell-check-root",
        unit: unit,
        backHref: backHref,
        backLabel: backLabel,
        defaultTimer: 120
      });
    })();
  </script>
  <script src="js/mastering-b2-skill-progress.js"></script>
  <script src="js/mastering-b2-exercise-auto.js"></script>
</body>
</html>
