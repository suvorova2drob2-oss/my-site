# Games + teacher constructor over HTTPS: https://77-110-113-165.sslip.io → node on 127.0.0.1:8787
# Certificate: certbot (webroot /var/www/letsencrypt), renewed by certbot.timer, deploy hook reloads nginx.
server {
    listen 80;
    listen [::]:80;
    server_name 77-110-113-165.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 77-110-113-165.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/77-110-113-165.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/77-110-113-165.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_games:10m;
    ssl_session_timeout 1d;

    # constructor saves send whole collections (up to 40 MB), media up to 25 MB
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
