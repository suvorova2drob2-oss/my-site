<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transcript — Track 12.1 · Disabled access</title>
  <link rel="stylesheet" href="../../css/cpe-listening-p3-mc-shell.css" />
  <link rel="stylesheet" href="../../css/cpe-quick-dictionary-drawer.css" />
  <style>
    body.cpe-l3-body {
      --cpe-qdict-fab-mid: rgba(36, 47, 63, 0.96);
      --line: var(--cpe-l3-line-soft);
      --text: var(--cpe-l3-text);
    }
    body.cpe-l3-body .cpe-qdict-def {
      white-space: pre-line;
      line-height: 1.45;
    }
    .cpe-l3-transcript-wrap {
      border: 1px solid var(--cpe-l3-line-soft);
      border-radius: 14px;
      background: rgba(16, 23, 34, 0.45);
      padding: 16px 18px;
      font-size: 0.95rem;
      line-height: 1.65;
    }
    .cpe-l3-turn { margin-bottom: 1em; }
    .cpe-l3-turn strong {
      color: var(--cpe-l3-accent);
      margin-right: 6px;
    }
    .cpe-l3-wtap {
      cursor: help;
      color: #b9e6ff;
      border-bottom: 1px dashed rgba(142, 197, 232, 0.65);
      border-radius: 2px;
      padding: 0 1px;
    }
    .cpe-l3-wtap:hover,
    .cpe-l3-wtap:focus {
      background: rgba(142, 197, 232, 0.14);
      outline: none;
    }
    .cpe-l3-wtip {
      position: absolute;
      z-index: 10050;
      max-width: min(360px, 92vw);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--cpe-l3-line);
      background: var(--cpe-l3-panel);
      color: var(--cpe-l3-text);
      font-size: 0.84rem;
      line-height: 1.45;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .cpe-l3-study-hint {
      font-size: 0.84rem;
      color: var(--cpe-l3-muted);
      margin: 0 0 12px;
    }
    @media (min-width: 900px) {
      body.cpe-l3-body.cpe-qdict-open .cpe-l3-page {
        margin-right: min(400px, 38vw);
        transition: margin 0.18s ease;
      }
    }
  </style>
</head>
<body class="cpe-l3-body">
  <main class="cpe-l3-page">
    <header class="cpe-l3-top">
      <div>
        <span class="cpe-l3-tag">Study · Transcript</span>
        <h1>Track 12.1 — Disabled access</h1>
        <p class="cpe-l3-lead">I = Interviewer · A = Alex · N = Nadiya</p>
      </div>
      <a class="cpe-l3-back" href="index.html?course=cpe">&larr; Exam task</a>
    </header>

    <section class="cpe-l3-audio">
      <label for="track-audio">Audio — RF_C2_SB_Track 12.1</label>
      <audio id="track-audio" controls preload="metadata"
        src="https://storage.yandexcloud.net/cpeaudio/cpe/12/RF_C2_SB_Track%2012.1.mp3"></audio>
    </section>

    <p class="cpe-l3-study-hint">Tap highlighted phrases in the text, or open the <strong>Quick dictionary</strong> on the right (📖).</p>

    <div class="cpe-l3-transcript-wrap" id="transcript-root"></div>
  </main>

  <script src="../../js/unit12-listening-sb12-1-disabled-access-lexicon.js"></script>
  <script src="../../js/cpe-listening-p3-mc-data.js"></script>
  <script src="../../js/unit12-listening-sb12-1-disabled-access-data.js"></script>
  <script src="../../js/cpe-listening-transcript-phrases.js"></script>
  <script src="../../js/cpe-quick-dictionary-drawer.js"></script>
  <script>
(function () {
  var pack =
    window.__CPE_LISTENING_P3_MC__ &&
    window.__CPE_LISTENING_P3_MC__.units &&
    window.__CPE_LISTENING_P3_MC__.units[0];
  var root = document.getElementById("transcript-root");
  var rows = window.U12_LISTENING_121_DICT_ROWS || [];
  if (!pack || !root || !pack.transcriptParagraphs) return;

  root.innerHTML = pack.transcriptParagraphs
    .map(function (p) {
      return (
        '<p class="cpe-l3-turn"><strong>' +
        p.speaker +
        ":</strong> " +
        p.text.replace(/</g, "&lt;") +
        "</p>"
      );
    })
    .join("");

  if (window.CPE_LISTENING_TRANSCRIPT_PHRASES) {
    window.CPE_LISTENING_TRANSCRIPT_PHRASES.mount({
      rootId: "transcript-root",
      rows: rows,
    });
  }

  var dictApi = null;
  if (window.CPE_QUICK_DICTIONARY && rows.length) {
    dictApi = window.CPE_QUICK_DICTIONARY.mount({
      prefix: "u12l121-dict",
      side: "right",
      rows: rows,
      sortRows: false,
      lede: "Key phrases from Track 12.1 — idioms, debating language, and collocations from the transcript.",
    });
    if (dictApi && dictApi.setOpen && window.matchMedia("(min-width: 900px)").matches) {
      dictApi.setOpen(true);
    }
  }
})();
  </script>
</body>
</html>
