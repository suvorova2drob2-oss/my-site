<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit 12 · Listening Part 3 — Disabled access (Track 12.1)</title>
  <link rel="stylesheet" href="../../css/cpe-listening-p3-mc-shell.css" />
</head>
<body class="cpe-l3-body">
  <main class="cpe-l3-page">
    <header class="cpe-l3-top">
      <div>
        <span class="cpe-l3-tag">CPE Unit 12 · Listening · Part 3</span>
        <h1>Disabled access to national parks</h1>
        <p class="cpe-l3-lead" id="page-lead">Track 12.1 — Alex Rogers &amp; Nadiya Thompson</p>
      </div>
      <a class="cpe-l3-back" id="back-link" href="../index.html?course=cpe">&larr; Listening</a>
    </header>

    <section class="cpe-l3-audio">
      <label for="track-audio">Audio — <span id="track-label">RF_C2_SB_Track 12.1</span></label>
      <audio id="track-audio" controls preload="metadata"></audio>
    </section>

    <p class="cpe-l3-instr" id="page-instr"></p>
    <p class="cpe-l3-study">
      <a href="transcript.html">Transcript (study)</a> · two listens in the exam; here you control playback.
    </p>

    <div id="cpe-l3-app" class="cpe-l3-app" aria-live="polite"></div>
  </main>

  <script src="../../js/cpe-listening-p3-mc-data.js"></script>
  <script src="../../js/unit12-listening-sb12-1-disabled-access-data.js"></script>
  <script src="../../js/cpe-listening-p3-mc-hunt.js"></script>
  <script src="../../js/cpe-listening-p3-mc-engine.js"></script>
  <script src="../../js/prep-hub-unit12-nests.js"></script>
  <script>
(function () {
  var pack =
    window.__CPE_LISTENING_P3_MC__ &&
    window.__CPE_LISTENING_P3_MC__.units &&
    window.__CPE_LISTENING_P3_MC__.units[0];

  if (!pack || !window.CPE_LISTENING_P3_MC) return;

  var audio = document.getElementById("track-audio");
  if (audio && pack.audioSrc) audio.src = pack.audioSrc;

  var instr = document.getElementById("page-instr");
  if (instr && pack.instructionHtml) instr.innerHTML = pack.instructionHtml;

  var trackLabel = document.getElementById("track-label");
  if (trackLabel && pack.trackLabel) trackLabel.textContent = pack.trackLabel;

  window.CPE_LISTENING_P3_MC.mount({ rootId: "cpe-l3-app", pack: pack });

  var back = document.getElementById("back-link");
  if (back) {
    var params = new URLSearchParams(location.search);
    if (params.get("course") === "cpe" || params.get("prep_stay") === "1") {
      var folderId =
        typeof PREP_LEGACY_U12_LISTENING_FOLDER_ID !== "undefined"
          ? PREP_LEGACY_U12_LISTENING_FOLDER_ID
          : "prep_legacy_u12_listening";
      back.href = "../../index.html?prep_stay=1&screen=unit12&prep_open_folder=" + encodeURIComponent(folderId);
      var lbl = params.get("backLabel");
      back.textContent = lbl ? "\u2190 " + lbl : "\u2190 Listening \u00b7 Level 12";
    }
  }
})();
  </script>
</body>
</html>
