<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="../../css/mastering-b2-back-link.css" />

  <style>
    body.sb12-ex-page { padding: 24px; }
    .sb12-ex-wrap { width: min(720px, 100%); margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    h1 { font-size: 1.15rem; margin: 0; color: #e8f0ff; }
    .tag { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; color: #86efac; margin-bottom: 6px; display: block; }
    .pc-person-bar { flex-wrap: wrap; }
  </style>
</head>
<body class="sb12-ex-page" data-mb2-unit="12" data-mb2-skill="reading" data-mb2-ex="u12-vegan-mcq">
  <div class="sb12-ex-wrap">
    <header class="top">
      <div>
        <span class="tag" id="personTag">Reading · Part 7</span>
        <h1 id="pageTitle">Multiple choice — Cool phrases</h1>
      </div>
      <a class="back" id="backLink" href="../part1-vegan-matching.html">&larr; Part 7</a>
    </header>
    <div id="personBar"></div>
    <div id="nextSpeakerLink"></div>
    <div class="vmcq-page" id="mcq-root"></div>
  </div>
  <script src="../../js/unit12-vegan-reading-lexis.js"></script>
  <script src="../../js/unit12-vegan-reading-pack-data.js"></script>
  <script src="../../js/unit12-vegan-exercise-boot.js"></script>
  <script src="../../js/fce-vocab-mcq-step-engine.js"></script>
  <script>
(function () {
  var B = window.U12_VEGAN_EX_BOOT;
  var P = window.U12_VEGAN_READING_PACK;
  if (!B || !P) return;
  B.readingBack("backLink");
  B.mountPersonBar("personBar", "phrase-mcq.html");
  B.mountNextSpeakerLink("nextSpeakerLink", "phrase-mcq.html");
  B.applyPersonLabels({ titles: { default: "Multiple choice — Cool phrases" } });
  var list = P.exercises(B.currentSpeaker());
  var nextCta = B.nextSpeakerCta("phrase-mcq.html");
  if (window.FCE_VOCAB_MCQ_STEP && list && list.length) {
    FCE_VOCAB_MCQ_STEP.mount({
      rootId: "mcq-root",
      exercises: list,
      autoAdvanceMs: 900,
      nextSpeakerHref: nextCta ? nextCta.href : "",
      nextSpeakerLabel: nextCta ? nextCta.label : ""
    });
  }
})();
  </script>
  <script src="../../js/mastering-b2-skill-progress.js"></script>
  <script src="../../js/mastering-b2-daily-activity.js"></script>
  <script src="../../js/mastering-b2-exercise-auto.js"></script>
</body>
</html>
