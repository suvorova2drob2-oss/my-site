<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit 1 &mdash; Vocabulary</title>
  <script>
(function () {
  try {
    var q = new URLSearchParams(window.location.search || "");
    if (String(q.get("course") || "").toLowerCase() === "cpe") {
      q.delete("course");
      var tail = q.toString();
      location.replace("cpe/index.html" + (tail ? "?" + tail + "&course=cpe" : "?course=cpe"));
    }
  } catch (e) {}
})();
  </script>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #101d3c;
      color: #e8f0ff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    a { color: #56ccf2; }
  </style>
</head>
<body>
  <p>Unit 1 vocabulary for CPE Prep lives in <a href="cpe/index.html?course=cpe">cpe/</a>.</p>
</body>
</html>
