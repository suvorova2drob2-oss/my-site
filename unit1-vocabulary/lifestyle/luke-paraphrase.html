  <script>
(function () {
  var B = window.U1_PC_EX_BOOT;
  var P = B && B.pack();
  if (B) {
    B.readingBack("backLink");
    B.mountPersonBar("personBar", "luke-paraphrase.html");
    B.applyPersonLabels({
      titles: {
        luke: "Paraphrase · flip cards (variants 2–3)",
        sophia: "Paraphrase · flip cards (antonyms)"
      }
    });
  }
  var vars = [];
  if (P) {
    if (B.isSophia() && P.paraphraseSophia && P.paraphraseSophia.variants) {
      vars = P.paraphraseSophia.variants;
    } else if (P.keyword && P.keyword.variants) {
      vars = P.keyword.variants.slice(1);
    }
  }
  if (window.FCE_LIFESTYLE_PARAPHRASE) {
    FCE_LIFESTYLE_PARAPHRASE.mount({ rootId: "paraphrase-root", variants: vars });
  }
})();
