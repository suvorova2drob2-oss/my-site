<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit 1 Vocabulary &mdash; Luke · phrase gaps</title>
  <link rel="stylesheet" href="../../css/mastering-b2-back-link.css" />
  <link rel="stylesheet" href="../../css/mastering-b2-page-skin.css" />
  <link rel="stylesheet" href="../../css/fce-vocab-word-box.css" />
  <link rel="stylesheet" href="../../css/fce-vocab-blog-gap.css" />
  <link rel="stylesheet" href="../../css/unit1-positive-change-exercise-person.css" />
  <style>
    .vocab-task { border: 1px solid #324a71; border-radius: 14px; padding: 18px; background: #223657; }
    .vocab-instr { font-size: var(--wb-font-body); line-height: var(--wb-line); color: #d5e2f8; margin: 0 0 12px; }
    .gap-input {
      display: inline-block;
      vertical-align: baseline;
      min-width: 9rem;
      width: 12rem;
      max-width: 100%;
      margin: 0 4px;
      padding: 7px 10px;
      border-radius: 8px;
      border: 2px solid #324a71;
      background: #132544;
      color: #e8f0ff;
      font: inherit;
      font-size: 0.92em;
    }
    .gap-input.is-active {
      border-color: #56ccf2;
      box-shadow: 0 0 0 3px rgba(86, 204, 242, 0.35);
    }
    @media (max-width: 759px) {
      .gap-input { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body class="vocab-wordbox-page" data-mb2-unit="1" data-mb2-skill="vocabulary" data-mb2-ex="luke-phrase-gaps">
  <main class="page">
    <header class="top">
      <div>
        <span class="tag" id="personTag">Vocabulary · Lifestyle · Luke</span>
        <h1 id="gapTitle">Fill in the gaps</h1>
      </div>
      <a class="back" id="backLink" href="../index.html">&larr; Vocabulary</a>
    </header>
    <div id="personBar" style="margin-bottom:12px;"></div>

    <section class="vocab-task">
      <p class="vocab-instr" id="gapNote"></p>

      <div class="vocab-bank-workspace">
        <div class="vocab-bank-main">
          <p class="vocab-wordbox-hint" id="gapHint">
            Click a gap, then a phrase on the right &mdash; or type in the box.
          </p>
          <div id="sentences"></div>
          <div class="vocab-btn-row">
            <button type="button" class="btn-check" id="btn-check">Check answers</button>
            <button type="button" class="btn-reset" id="btn-reset">Reset</button>
          </div>
          <p class="vocab-feedback" id="feedback" role="status" aria-live="polite"></p>
        </div>
        <aside class="vocab-bank-rail" aria-label="Phrase box">
          <div class="vocab-bank" id="word-bank" aria-label="Phrase box"></div>
        </aside>
      </div>
    </section>
  </main>
  <script src="../../js/mastering-b2-skill-progress.js"></script>
  <script src="../../js/prep-vocab-word-box-gaps.js"></script>
  <script src="../../js/unit1-luke-lifestyle-pack-data.js"></script>
  <script src="../../js/unit1-making-a-positive-change-exercise-boot.js"></script>
  <script>
(function () {
  var B = window.U1_PC_EX_BOOT;
  var P = B && B.pack();
  if (B) {
    B.readingBack("backLink");
    B.mountPersonBar("personBar", "luke-phrase-gaps.html");
    B.applyPersonLabels({});
  }
  var G =
    (P && (B.isSophia() ? P.gapsSophia : P.gaps)) || {};
  document.getElementById("gapTitle").textContent = G.title || "Fill in the gaps";
  document.getElementById("gapNote").textContent = G.note || "";

  var items = G.items || [];
  var bank = G.bank || [];
  var hintEl = document.getElementById("gapHint");
  if (hintEl && items.length) {
    hintEl.textContent =
      "Click a gap (1\u2013" +
      items.length +
      "), then a phrase on the right \u2014 or type in the box.";
  }
  var bankEl = document.getElementById("word-bank");
  bankEl.innerHTML =
    "<strong>Phrases</strong>" +
    bank
      .map(function (w) {
        return (
          '<button type="button" class="bank-chip" data-word="' +
          w.replace(/"/g, "&quot;") +
          '">' +
          w +
          "</button>"
        );
      })
      .join("");

  var html = "";
  var i;
  for (i = 0; i < items.length; i++) {
    html +=
      '<p class="gap-sent"><span class="gap-num">' +
      (i + 1) +
      "</span> " +
      items[i].before +
      ' <input type="text" class="gap-input" id="gap-' +
      (i + 1) +
      '" autocomplete="off" spellcheck="false" aria-label="Gap ' +
      (i + 1) +
      '"> ' +
      items[i].after +
      "</p>";
  }
  document.getElementById("sentences").innerHTML = html;

  var ACCEPT = {};
  var SHOW = {};
  for (i = 0; i < items.length; i++) {
    ACCEPT[i + 1] = items[i].answers || [];
    SHOW[i + 1] = (items[i].answers && items[i].answers[0]) || "";
  }
  var n = items.length;

  function norm(s) {
    return String(s || "")
      .trim()
      .toLowerCase()
      .replace(/\u2019/g, "'")
      .replace(/\s+/g, " ");
  }

  var fb = document.getElementById("feedback");
  var gapIds = [];
  for (i = 1; i <= n; i++) gapIds.push(i);

  PREP_VOCAB_WORD_BOX_GAPS.mount({
    bankRoot: "#word-bank",
    gapIds: gapIds,
    gapIdPrefix: "gap-",
    onFill: function () {
      fb.textContent = "";
      fb.classList.remove("is-ok", "is-bad");
    }
  });

  function setGapHint(el, show, keyText) {
    var sent = el.closest(".gap-sent");
    if (!sent) return;
    var hint = sent.querySelector(".mb2-key-hint");
    if (!hint) {
      hint = document.createElement("span");
      hint.className = "mb2-key-hint";
      sent.appendChild(hint);
    }
    hint.textContent = show ? "\u2192 " + keyText : "";
    hint.classList.toggle("is-show", !!show);
  }

  document.getElementById("btn-check").addEventListener("click", function () {
    var okc = 0;
    for (var g = 1; g <= n; g++) {
      var el = document.getElementById("gap-" + g);
      var u = norm(el.value);
      var ok = false;
      var list = ACCEPT[g];
      for (var j = 0; j < list.length; j++) {
        if (norm(list[j]) === u) ok = true;
      }
      el.classList.toggle("is-ok", ok);
      el.classList.toggle("is-bad", !ok);
      setGapHint(el, !ok, SHOW[g]);
      if (ok) okc++;
    }
    fb.textContent =
      okc === n
        ? "All " + n + " correct."
        : "Score: " + okc + " / " + n + ".";
    fb.classList.toggle("is-ok", okc === n);
    fb.classList.toggle("is-bad", okc !== n);
    if (window.MasteringB2Progress) MasteringB2Progress.recordCheckFromDom(okc, n);
  });

  document.getElementById("btn-reset").addEventListener("click", function () {
    document.querySelectorAll(".gap-input").forEach(function (el) {
      el.value = "";
      el.classList.remove("is-ok", "is-bad", "is-active");
      setGapHint(el, false, "");
    });
    fb.textContent = "";
    fb.classList.remove("is-ok", "is-bad");
  });
})();
  </script>
  <script src="../../js/mastering-b2-daily-activity.js"></script>
  <script src="../../js/mastering-b2-exercise-auto.js"></script>
</body>
</html>
