<body data-mb2-unit="1" data-mb2-skill="vocabulary" data-mb2-ex="luke-role-play">

  <div class="wrap">

    <header class="top">

      <div>

        <span class="tag" id="personTag">Vocabulary · Lifestyle · Luke</span>

        <h1 id="pageTitle">Role-play · Time for a change?</h1>

      </div>

      <a class="back" id="backLink" href="../index.html">&larr; Vocabulary</a>

    <div id="rp-root"></div>

  <script src="../../js/unit1-luke-lifestyle-pack-data.js"></script>

  <script src="../../js/unit1-making-a-positive-change-exercise-boot.js"></script>

  <script src="../../js/fce-cool-phrases-drawer.js"></script>

  <script>

(function () {

  var B = window.U1_PC_EX_BOOT;

  var P = B && B.pack();

  if (B) {

    B.readingBack("backLink");

    B.mountPersonBar("personBar", "luke-role-play.html");

    B.applyPersonLabels({

      titles: {

        luke: "Role-play · Time for a change?",

        sophia: "Role-play · Sophia & Alex"

      }

    });

  }

  var rp =

    P &&

    (B && B.isSophia() ? P.roleplaySophia : P.roleplay);

  if (rp && window.FCE_COOL_PHRASES_DRAWER) {

    FCE_COOL_PHRASES_DRAWER.mountRoleplayPage("rp-root", rp);

  }

})();

  </script>

  <script src="../../js/mastering-b2-skill-progress.js"></script>
