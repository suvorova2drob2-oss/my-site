<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit 1 Vocabulary &mdash; Clothes (choose the adjective)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/mastering-b2-page-skin.css" />
  <style>
    .page { width: min(880px, 100%); margin: 0 auto; padding: clamp(16px, 3vw, 24px); }
    .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid rgba(120,160,210,.18); padding-bottom: 14px; margin-bottom: 14px; }
    .tag { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #86efac; margin-bottom: 6px; }
    .top h1 { margin: 0; font-size: clamp(1.05rem, 2.8vw, 1.25rem); line-height: 1.3; }
    .voc-nav { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 16px; font-size: .9rem; }
    .voc-nav a { color: #56ccf2; font-weight: 600; text-decoration: none; }
    .voc-nav span { color: #9bb0d3; }
    .task { border: 1px solid rgba(120,160,210,.2); border-radius: 14px; padding: 16px; background: rgba(18,30,52,.55); }
    .task h2 { font-family: Fraunces, Georgia, serif; font-size: 1.08rem; color: #bae6fd; margin: 0 0 8px; }
    .instr { color: #c5d4ef; font-size: .94rem; line-height: 1.55; margin: 0 0 14px; }
    .sent { margin: 0 0 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(120,160,210,.16); background: rgba(8,22,48,.35); font-size: .95rem; line-height: 1.55; color: #e8f0ff; }
    .sent.is-example { opacity: .92; }
    .pair { display: inline-flex; gap: 6px; flex-wrap: wrap; vertical-align: middle; margin: 0 2px; }
    .opt {
      appearance: none; border: 1.5px solid rgba(120,160,210,.35); background: rgba(16,28,50,.9);
      color: #d5e2f8; font: inherit; font-size: .9rem; font-style: italic; font-weight: 600;
      padding: 4px 10px; border-radius: 8px; cursor: pointer;
    }
    .opt.is-picked { border-color: #56ccf2; background: rgba(86,204,242,.18); color: #e8f6ff; }
    .opt.is-ok { border-color: #22c55e !important; background: rgba(34,197,94,.22) !important; color: #ecfdf5 !important; }
    .opt.is-bad { border-color: #f87171 !important; background: rgba(248,113,113,.2) !important; }
    .opt:disabled { cursor: default; opacity: .85; }
    .ex-ans { font-style: italic; color: #fde68a; border-bottom: 1px solid rgba(253,230,138,.45); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .feedback { min-height: 1.25em; margin-top: 8px; font-size: .9rem; font-weight: 600; color: #9bb0d3; }
    .feedback.is-ok { color: #86efac; }
    .feedback.is-bad { color: #fca5a5; }
  </style>
</head>
<body data-mb2-unit="1" data-mb2-skill="vocabulary" data-mb2-ex="clothes-choose">
  <main class="page">
    <header class="top">
      <div>
        <div class="tag">Vocabulary · Clothes</div>
        <h1>Choose the correct adjective</h1>
      </div>
      <a class="back" href="../index.html">&larr; Vocabulary</a>
    </header>
    <nav class="voc-nav" aria-label="Clothes exercises">
      <a href="../index.html">Hub</a>
      <span>|</span>
      <a href="../clothes-opposites/index.html">Opposites (gaps)</a>
      <span>|</span>
      <span><strong>Choose</strong></span>
      <span>|</span>
      <a href="../get/index.html">Get</a>
      <a href="../run-expressions/index.html">Run</a>
    </nav>

    <section class="task">
      <h2>Clothes</h2>
      <p class="instr">Choose the correct adjectives to complete the sentences. Tap one option in each pair.</p>
      <div id="items"></div>
      <div class="btn-row">
        <button type="button" class="btn-check" id="btn-check">Check</button>
        <button type="button" class="btn-reset" id="btn-reset">Clear</button>
      </div>
      <p class="feedback" id="fb" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="../../js/mastering-b2-skill-progress.js"></script>
  <script>
(function () {
  var ITEMS = [
    { n: 0, before: "I'm not keen on ", a: "casual", b: "tight-fitting", after: " clothes. I prefer baggy ones.", key: "tight-fitting", example: true },
    { n: 1, before: "Oh no! I've got wine on my ", a: "brand new", b: "second-hand", after: " silk shirt.", key: "brand new" },
    { n: 2, before: "It's best to wear a ", a: "scruffy", b: "smart", after: " suit to an interview.", key: "smart" },
    { n: 3, before: "Wow! I love the shoes. They're so modern and ", a: "trendy", b: "baggy", after: ".", key: "trendy" },
    { n: 4, before: "I'd wear ", a: "casual", b: "formal", after: " clothes like jeans every day if I could.", key: "casual" },
    { n: 5, before: "He always chooses dark stuff, nothing ", a: "tight-fitting", b: "colourful", after: " at all!", key: "colourful" },
    { n: 6, before: "Everyone wore very ", a: "casual", b: "formal", after: " dresses to the ball.", key: "formal" },
    { n: 7, before: "", a: "Plain", b: "Scruffy", after: " tops tend to be versatile because they go with anything.", key: "Plain" },
    { n: 8, before: "Mohammed's clothes are ", a: "smart", b: "baggy", after: " because he's lost weight.", key: "baggy" }
  ];

  var picks = {};
  var root = document.getElementById("items");
  var fb = document.getElementById("fb");

  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function render() {
    root.innerHTML = ITEMS.map(function (it) {
      if (it.example) {
        return (
          '<div class="sent is-example"><strong>0</strong> ' +
          esc(it.before) +
          '<span class="ex-ans">' + esc(it.key) + "</span>" +
          esc(it.after) +
          ' <span style="color:#9bb0d3;font-size:.85rem">(example)</span></div>'
        );
      }
      return (
        '<div class="sent" data-n="' + it.n + '"><strong>' + it.n + "</strong> " +
        esc(it.before) +
        '<span class="pair" role="group" aria-label="Options for ' + it.n + '">' +
        '<button type="button" class="opt" data-n="' + it.n + '" data-v="' + esc(it.a) + '">' + esc(it.a) + "</button>" +
        '<button type="button" class="opt" data-n="' + it.n + '" data-v="' + esc(it.b) + '">' + esc(it.b) + "</button>" +
        "</span>" +
        esc(it.after) +
        '<div class="mb2-key-hint" id="h' + it.n + '"></div></div>'
      );
    }).join("");

    root.querySelectorAll(".opt").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var n = Number(btn.getAttribute("data-n"));
        var v = btn.getAttribute("data-v");
        picks[n] = v;
        root.querySelectorAll('.opt[data-n="' + n + '"]').forEach(function (b) {
          b.classList.toggle("is-picked", b.getAttribute("data-v") === v);
          b.classList.remove("is-ok", "is-bad");
        });
        var hint = document.getElementById("h" + n);
        if (hint) { hint.textContent = ""; hint.classList.remove("is-show"); }
        fb.textContent = "";
        fb.className = "feedback";
      });
    });
  }

  function check() {
    var scored = ITEMS.filter(function (it) { return !it.example; });
    var ok = 0;
    scored.forEach(function (it) {
      var chosen = picks[it.n] || "";
      var good = chosen.toLowerCase() === it.key.toLowerCase();
      root.querySelectorAll('.opt[data-n="' + it.n + '"]').forEach(function (b) {
        var v = b.getAttribute("data-v");
        b.classList.remove("is-ok", "is-bad");
        if (v.toLowerCase() === it.key.toLowerCase() && good) b.classList.add("is-ok");
        else if (v === chosen && !good) b.classList.add("is-bad");
        else if (v.toLowerCase() === it.key.toLowerCase() && !good) b.classList.add("is-ok");
      });
      var hint = document.getElementById("h" + it.n);
      if (hint) {
        hint.textContent = good ? "" : it.key;
        hint.classList.toggle("is-show", !good);
      }
      if (good) ok++;
    });
    fb.textContent = ok + " / " + scored.length + " correct";
    fb.className = "feedback " + (ok === scored.length ? "is-ok" : "is-bad");
    if (window.MasteringB2Progress) {
      MasteringB2Progress.record({
        unit: 1, skill: "vocabulary", exerciseId: "clothes-choose",
        percent: Math.round((ok / scored.length) * 100)
      });
    }
  }

  function reset() {
    picks = {};
    render();
    fb.textContent = "";
    fb.className = "feedback";
  }

  document.getElementById("btn-check").addEventListener("click", check);
  document.getElementById("btn-reset").addEventListener("click", reset);
  render();
})();
  </script>
</body>
</html>
