<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit 1 Vocabulary &mdash; Meeting my hero (get phrases)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/mastering-b2-page-skin.css" />
  <style>
    .page { width: min(880px, 100%); margin: 0 auto; padding: clamp(16px, 3vw, 24px); }
    .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid rgba(120,160,210,.18); padding-bottom: 14px; margin-bottom: 14px; }
    .tag { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #86efac; margin-bottom: 6px; }
    .top h1 { margin: 0; font-size: clamp(1.05rem, 2.8vw, 1.25rem); line-height: 1.3; }
    .voc-nav { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 16px; font-size: .9rem; }
    .voc-nav a { color: #56ccf2; font-weight: 600; text-decoration: none; }
    .voc-nav span { color: #9bb0d3; }
    .task { border: 1px solid rgba(120,160,210,.2); border-radius: 14px; padding: 16px; background: rgba(18,30,52,.55); }
    .task h2 { font-family: Fraunces, Georgia, serif; font-size: 1.08rem; color: #bae6fd; margin: 0 0 8px; }
    .instr { color: #c5d4ef; font-size: .94rem; line-height: 1.55; margin: 0 0 12px; }
    .bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; padding: 12px; border-radius: 10px; border: 1px dashed rgba(120,160,210,.28); background: rgba(8,22,48,.4); }
    .bank strong { width: 100%; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: #93c5fd; }
    .chip {
      appearance: none; border: 1px solid rgba(212,184,122,.4); background: rgba(30,40,62,.9);
      color: #f3e7c8; font: inherit; font-weight: 700; font-size: .86rem; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    }
    .chip.is-used { opacity: .35; cursor: default; }
    .chip.is-selected { border-color: #56ccf2; box-shadow: 0 0 0 2px rgba(86,204,242,.3); }
    .chip.is-example { opacity: .45; text-decoration: line-through; cursor: default; }
    .story {
      font-family: Literata, Georgia, "Palatino Linotype", serif;
      font-size: 1.02rem;
      line-height: 1.7;
      color: #2a241c;
      background: linear-gradient(180deg, #f7f1e8 0%, #f3ebe0 42%, #efe6d8 100%);
      border: 1px solid rgba(42,36,28,.14);
      border-radius: 2px 14px 14px 2px;
      box-shadow: 0 14px 36px rgba(0,0,0,.28);
      padding: clamp(1.1rem, 2.4vw, 1.5rem);
      margin-bottom: 12px;
    }
    .story h3 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.2rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin: 0 0 12px;
      color: #1a2f3d;
    }
    .story p { margin: 0 0 1em; }
    .story p:last-child { margin-bottom: 0; }
    .gap {
      display: inline-flex; min-width: 7.5rem; margin: 0 2px; padding: 2px 8px; border-radius: 8px;
      border: 1.5px dashed rgba(42,36,28,.35); background: rgba(255,255,255,.55); color: #2a241c;
      font: inherit; font-weight: 700; font-size: .95em; cursor: pointer; vertical-align: baseline;
    }
    .gap.is-filled { border-style: solid; border-color: rgba(61,90,76,.45); background: rgba(255,255,255,.9); }
    .gap.is-ok { border-color: #16a34a !important; background: #ecfdf5 !important; }
    .gap.is-bad { border-color: #dc2626 !important; background: #fef2f2 !important; }
    .ex { font-weight: 700; color: #1a2f3d; border-bottom: 1.5px solid rgba(26,47,61,.35); }
    .gap-hint {
      display: none; margin-left: 4px; font-family: Manrope, system-ui, sans-serif;
      font-size: .78rem; font-weight: 700; color: #15803d;
    }
    .gap-hint.is-show { display: inline; }
    .gap-hint::before { content: "→ "; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .feedback { min-height: 1.25em; margin-top: 8px; font-size: .9rem; font-weight: 600; color: #9bb0d3; }
    .feedback.is-ok { color: #86efac; }
    .feedback.is-bad { color: #fca5a5; }
  </style>
</head>
<body data-mb2-unit="1" data-mb2-skill="vocabulary" data-mb2-ex="get-meeting-hero">
  <main class="page">
    <header class="top">
      <div>
        <div class="tag">Vocabulary · Get</div>
        <h1>Meeting my hero</h1>
      </div>
      <a class="back" href="../index.html">&larr; Vocabulary</a>
    </header>
    <nav class="voc-nav" aria-label="Get exercises">
      <a href="../index.html">Hub</a>
      <span>|</span>
      <a href="index.html">Meanings</a>
      <a href="phrases.html">Phrases</a>
      <span>|</span>
      <span><strong>Meeting my hero</strong></span>
    </nav>

    <section class="task">
      <h2>2 Gap-fill &mdash; correct form</h2>
      <p class="instr">
        Complete each gap in the text with the correct form of the phrases from the box.
        There is an example at the beginning (0). Click a chip, then a gap.
      </p>
      <div class="bank" id="bank" aria-label="Phrase box"></div>
      <article class="story" id="story" aria-label="Meeting my hero"></article>
      <div class="btn-row">
        <button type="button" class="btn-check" id="btn-check">Check</button>
        <button type="button" class="btn-reset" id="btn-reset">Clear</button>
      </div>
      <p class="feedback" id="fb" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="../../js/mastering-b2-skill-progress.js"></script>
  <script>
(function () {
  /** Base phrases in the box (example already used). */
  var BANK = [
    "get angry",
    "get excited",
    "get into trouble",
    "get over it",
    "get rid of",
    "get stressed",
    "get stuck",
    "get the chance",
    "get to have"
  ];

  /**
   * Gap answers = inflected forms; map back to base for bank use.
   * key = accepted fill; base = bank chip id
   */
  var GAPS = [
    { n: 1, key: "get the chance", base: "get the chance", alts: ["get the chance"] },
    { n: 2, key: "got rid of", base: "get rid of", alts: ["got rid of", "gotten rid of"] },
    { n: 3, key: "got stressed", base: "get stressed", alts: ["got stressed"] },
    { n: 4, key: "got stuck", base: "get stuck", alts: ["got stuck"] },
    { n: 5, key: "getting to have", base: "get to have", alts: ["getting to have"] },
    { n: 6, key: "got into trouble", base: "get into trouble", alts: ["got into trouble"] },
    { n: 7, key: "got angry", base: "get angry", alts: ["got angry"] },
    { n: 8, key: "get over it", base: "get over it", alts: ["get over it"] }
  ];

  var FORM = {
    "get angry": "got angry",
    "get excited": "get excited",
    "get into trouble": "got into trouble",
    "get over it": "get over it",
    "get rid of": "got rid of",
    "get stressed": "got stressed",
    "get stuck": "got stuck",
    "get the chance": "get the chance",
    "get to have": "getting to have"
  };

  var fills = {}; // n -> base phrase
  var selected = null;
  var bankEl = document.getElementById("bank");
  var storyEl = document.getElementById("story");
  var fb = document.getElementById("fb");

  function usedBases() {
    var u = { "get excited": true };
    Object.keys(fills).forEach(function (k) {
      if (fills[k]) u[fills[k]] = true;
    });
    return u;
  }

  function displayFor(base) {
    return FORM[base] || base;
  }

  function syncBank() {
    var used = usedBases();
    bankEl.querySelectorAll(".chip").forEach(function (chip) {
      var w = chip.getAttribute("data-w");
      var isEx = w === "get excited";
      var u = !!used[w];
      chip.classList.toggle("is-used", u && !isEx);
      chip.classList.toggle("is-example", isEx);
      chip.classList.toggle("is-selected", selected === w);
      chip.disabled = u;
    });
  }

  function renderStory() {
    function gapBtn(n) {
      var base = fills[n];
      var show = base ? displayFor(base) : "(" + n + ")";
      return (
        '<button type="button" class="gap' + (base ? " is-filled" : "") + '" data-n="' + n + '" aria-label="Gap ' + n + '">' +
        show +
        '</button><span class="gap-hint" data-hint="' + n + '"></span>'
      );
    }

    storyEl.innerHTML =
      "<h3>Meeting my hero</h3>" +
      "<p>When I heard that Roger Federer was going to be playing an exhibition match in my home town, I tried not to " +
      '<span class="ex">(0) get too excited</span> &mdash; I was supposed to be working that day after all. But as my friend said, when would we ' +
      gapBtn(1) +
      " to see such a legend play again?</p>" +
      "<p>I&rsquo;m happy that I hadn&rsquo;t " +
      gapBtn(2) +
      " my old tennis racket because I wanted him to sign the handle. I " +
      gapBtn(3) +
      " on the way there, as we " +
      gapBtn(4) +
      " in an awful traffic jam and I didn&rsquo;t think we were going to make it. I mean, " +
      gapBtn(5) +
      " this experience wasn&rsquo;t something that happened to me every day and I didn&rsquo;t want to miss it. I got there just in time and was over the moon to chat to him.</p>" +
      "<p>Unfortunately, I " +
      gapBtn(6) +
      " because I was on the local news talking to him. My boss " +
      gapBtn(7) +
      " because I should have been at work. One day, she&rsquo;ll " +
      gapBtn(8) +
      ", but it might take a while!</p>";

    storyEl.querySelectorAll(".gap").forEach(function (btn) {
      btn.addEventListener("click", onGapClick);
    });
  }

  function onGapClick(ev) {
    var btn = ev.currentTarget;
    var n = Number(btn.getAttribute("data-n"));
    clearMarks();
    if (selected) {
      var word = selected;
      Object.keys(fills).forEach(function (k) {
        if (fills[k] === word) delete fills[k];
      });
      fills[n] = word;
      selected = null;
      renderStory();
      syncBank();
      return;
    }
    if (fills[n]) {
      delete fills[n];
      renderStory();
      syncBank();
    }
  }

  function buildBank() {
    bankEl.innerHTML = "<strong>Phrases</strong>";
    BANK.forEach(function (w) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.setAttribute("data-w", w);
      chip.textContent = w;
      chip.addEventListener("click", function () {
        if (usedBases()[w]) return;
        selected = selected === w ? null : w;
        syncBank();
        clearMarks();
      });
      bankEl.appendChild(chip);
    });
  }

  function clearMarks() {
    storyEl.querySelectorAll(".gap").forEach(function (g) {
      g.classList.remove("is-ok", "is-bad");
    });
    storyEl.querySelectorAll(".gap-hint").forEach(function (h) {
      h.textContent = "";
      h.classList.remove("is-show");
    });
    fb.textContent = "";
    fb.className = "feedback";
  }

  function check() {
    var ok = 0;
    GAPS.forEach(function (g) {
      var base = fills[g.n] || "";
      var filled = base ? displayFor(base) : "";
      var good = g.alts.some(function (a) {
        return a.toLowerCase() === filled.toLowerCase();
      });
      var btn = storyEl.querySelector('.gap[data-n="' + g.n + '"]');
      var hint = storyEl.querySelector('.gap-hint[data-hint="' + g.n + '"]');
      if (btn) {
        btn.classList.toggle("is-ok", good);
        btn.classList.toggle("is-bad", !good);
      }
      if (hint) {
        hint.textContent = good ? "" : g.key;
        hint.classList.toggle("is-show", !good);
      }
      if (good) ok++;
    });
    fb.textContent = ok + " / " + GAPS.length + " correct";
    fb.className = "feedback " + (ok === GAPS.length ? "is-ok" : "is-bad");
    if (window.MasteringB2Progress) {
      MasteringB2Progress.record({
        unit: 1,
        skill: "vocabulary",
        exerciseId: "get-meeting-hero",
        percent: Math.round((ok / GAPS.length) * 100)
      });
    }
  }

  function reset() {
    fills = {};
    selected = null;
    renderStory();
    syncBank();
    clearMarks();
  }

  buildBank();
  renderStory();
  syncBank();
  document.getElementById("btn-check").addEventListener("click", check);
  document.getElementById("btn-reset").addEventListener("click", reset);
})();
  </script>
</body>
</html>
