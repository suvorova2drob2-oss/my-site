<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit 1 — Sticky board</title>
  <link rel="stylesheet" href="../../css/sticky-board-page.css?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/mastering-b2-page-skin.css" />
  <link rel="stylesheet" href="../../css/mastering-b2-back-link.css" />
</head>
<body>
  <div id="sticky-board-root"></div>
  <script src="../../js/sticky-board-core.js"></script>
  <script src="../../js/unit1-sticky-packs.js"></script>
  <script src="../../js/sticky-board-page.js?v=2"></script>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var packId = p.get("pack") || "lifestyle";
      var api = window.FCE_U1_STICKY;
      if (!api) return;
      STICKY_BOARD_PAGE.mount({
        pack: api.getPack(packId),
        allPacks: api.packs,
        vocabGamesHref: "../../unit1-lexical-games.html"
      });
    })();
  </script>
</body>
</html>
