<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listening &mdash; Unit 1 (CPE Prep)</title>
  <style>
    :root {
      --panel: #1d2b4a;
      --panel-soft: #223657;
      --line: #324a71;
      --text: #e8f0ff;
      --muted: #9bb0d3;
      --accent: #56ccf2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(180deg, #09122a 0%, #101d3c 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .page {
      width: min(920px, 100%);
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }
    .top h1 { font-size: 1.3rem; }
    .back { color: var(--accent); text-decoration: none; font-weight: 600; }
    .back:hover { text-decoration: underline; }
    .lead { color: var(--muted); font-size: 0.94rem; line-height: 1.5; margin-bottom: 18px; }
    .task-card {
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      background: var(--panel-soft);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .task-card:hover {
      border-color: #4a6898;
      transform: translateY(-2px);
    }
    .task-card h2 { font-size: 1.05rem; margin-bottom: 8px; color: #bae6fd; }
    .task-card p { font-size: 0.9rem; color: var(--muted); line-height: 1.45; }
    .task-card .go { margin-top: 10px; color: var(--accent); font-weight: 700; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>Listening &mdash; Unit 1</h1>
      <a class="back" id="back-link" data-u1-levels-depth="2" href="../../index.html?prep_stay=1&amp;screen=unit1&amp;prep_open_folder=prep_legacy_u1_listening">&larr; Level 1</a>
    </header>
    <p class="lead">CPE Prep &mdash; coursebook listening tasks for Level 1.</p>

    <a class="task-card" href="part1/index.html?course=cpe&amp;backLabel=Listening%20%E2%80%94%20Level%201">
      <h2>Part 1 &middot; Multiple choice</h2>
      <p>Three extracts &middot; questions 1&ndash;6 &middot; A / B / C &middot; clothing, jobs, oral history</p>
      <span class="go">Open &rarr;</span>
    </a>
  </main>
  <script src="../../js/u1-vocab-course-context.js"></script>
  <script src="../../js/prep-course-profile.js"></script>
</body>
</html>
