<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SB 1.2 &mdash; role-play</title>
  <link rel="stylesheet" href="../../css/mastering-b2-back-link.css" />
  <link rel="stylesheet" href="../../css/unit1-lifestyle-phrases-drawer.css" />
  <link rel="stylesheet" href="../../css/unit1-positive-change-exercise-person.css" />
  <link rel="stylesheet" href="../../css/unit1-sb12-exercise-responsive.css" />
  <style>
    body.sb12-ex-page {
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(180deg, #09122a 0%, #101d3c 100%);
      color: #e8f0ff;
    }
    .sb12-ex-wrap { width: min(720px, 100%); margin: 0 auto; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }
    h1 { font-size: 1.15rem; margin: 0; }
    .tag {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #86efac;
      margin-bottom: 6px;
      display: block;
    }
    #rp-root.fce-u1-ph-rp {
      padding: 18px 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(120, 160, 210, 0.2);
      background: rgba(8, 18, 36, 0.55);
    }
  </style>
</head>
<body class="sb12-ex-page" data-mb2-unit="1" data-mb2-skill="listening" data-mb2-ex="sb-1-2-roleplay">
  <div class="sb12-ex-wrap">
    <header class="top">
      <div>
        <span class="tag" id="personTag">Listening · SB 1.2</span>
        <h1 id="pageTitle">Role-play</h1>
      </div>
      <a class="back" id="backLink" href="index.html">&larr; SB 1.2</a>
    </header>
    <div id="personBar"></div>
    <div id="nextSpeakerLink"></div>
    <div id="rp-root"></div>
  </div>
  <script src="../../js/unit1-sb12-listening-lexis.js"></script>
  <script src="../../js/unit1-sb12-listening-pack-data.js"></script>
  <script src="../../js/unit1-sb12-exercise-boot.js"></script>
  <script src="../../js/fce-cool-phrases-drawer.js"></script>
  <script>
(function () {
  var B = window.U1_SB12_EX_BOOT;
  var P = window.U1_SB12_LISTENING_PACK;
  if (!B || !P) return;
  B.listeningBack("backLink");
  B.mountPersonBar("personBar", "role-play.html");
  B.mountNextSpeakerLink("nextSpeakerLink", "role-play.html");
  var sid = B.currentSpeaker();
  var rp = P.roleplay(sid);
  var sp = P.speakerById(sid);
  B.applyPersonLabels({
    titles: { default: rp && rp.title ? "Role-play · " + rp.title : "Role-play" }
  });
  if (rp && window.FCE_COOL_PHRASES_DRAWER) {
    FCE_COOL_PHRASES_DRAWER.mountRoleplayPage("rp-root", rp);
  } else {
    document.getElementById("rp-root").innerHTML =
      "<p>No role-play for this speaker.</p>";
  }
})();
  </script>
  <script src="../../js/mastering-b2-skill-progress.js"></script>
  <script src="../../js/mastering-b2-daily-activity.js"></script>
  <script src="../../js/mastering-b2-exercise-auto.js"></script>
</body>
</html>
