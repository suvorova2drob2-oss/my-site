<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
  />
  <meta name="prep-deploy-track" content="ege" />
  <title>ЕГЭ — Speaking · logic-comparison</title>
  <link rel="stylesheet" href="css/ege-shell.css" />

<body class="ege-shell-page ege-shell-page--speaking-lc">
  <div class="ege-shell">
    <a class="ege-back" href="ege-speaking-gym.html">&larr; Speaking Gym</a>

    <div class="ege-reading-stats-bar" id="lc-stats-bar" role="region" aria-label="Статистика по этой теме"></div>

    <header class="es-lc-hero">
      <div class="es-lc-badge-row">
        <span class="es-lc-task-badge">Task 4 · Photo project · 2 photos</span>
      </div>
      <h1 id="lcTitle">logic-comparison</h1>
      <p class="ege-lead" id="lcLead"></p>
      <div class="es-lc-theme-row">
        <label class="es-lc-theme-label" for="lcUnitSelect">Вариант</label>
        <select class="es-lc-theme-select" id="lcUnitSelect"></select>
      </div>
    </header>

    <details class="es-lc-howto">
      <summary>Как пользоваться</summary>
      <p>
        <strong>Start</strong> → 2:30 подготовки с двумя фото и планом → 3:00 speaking вслух →
        <strong>Посмотреть model answer</strong>: образец монолога, критерии и useful language.
      </p>
    </details>

    <div class="es-lc-grid">
      <main class="es-lc-panel">
        <div class="es-lc-timer-box">
          <div>
            <div class="es-lc-timer-label" id="lcTimerLabel">Exam mode</div>
            <div class="es-lc-timer" id="lcTimer">2:30</div>
          </div>
          <span class="es-lc-phase es-lc-phase--idle" id="lcPhaseBadge">Ready</span>
        </div>

        <p class="es-lc-status" id="lcStatus"></p>
        <p class="es-lc-intro" id="lcIntro"></p>
        <p class="es-lc-ready-intro" id="lcReadyIntro"></p>
        <div class="es-lc-bullets" id="lcBullets"></div>
        <p class="es-lc-speak-note" id="lcSpeakNote"></p>

        <div id="lcPhotos"></div>

        <div class="es-lc-review-wrap" id="lcReviewPanel" hidden>
          <h2 class="es-lc-review-title">Model answer — сверка</h2>
          <div id="lcModel"></div>
        </div>

        <div class="es-lc-actions">
          <button type="button" class="es-lc-btn es-lc-btn--accent" id="lcBtnStart">Start exam mode</button>
          <button type="button" class="es-lc-btn es-lc-btn--ghost" id="lcBtnSkipPrepare" hidden>Skip prep</button>
          <button type="button" class="es-lc-btn es-lc-btn--accent" id="lcBtnShowModel" hidden>Посмотреть model answer</button>
          <button type="button" class="es-lc-btn es-lc-btn--ghost" id="lcBtnRestart" hidden>Try again</button>
        </div>
      </main>

      <aside class="es-lc-panel">
        <h2>Plan &amp; tips</h2>
        <div id="lcSidePanel"></div>
      </aside>
    </div>
  </div>
