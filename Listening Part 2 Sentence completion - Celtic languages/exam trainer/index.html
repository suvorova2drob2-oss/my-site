<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listening Part 2 &middot; Celtic languages</title>
  <style>
    :root { --bg: #1e293b; --panel: #334155; --text: #f1f5f9; --muted: #94a3b8; --accent: #38bdf8; --line: #475569; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top, 0px))
        max(16px, env(safe-area-inset-right, 0px))
        max(32px, env(safe-area-inset-bottom, 0px))
        max(16px, env(safe-area-inset-left, 0px));
    }
    .wrap { width: 100%; max-width: 860px; margin: 0 auto; }
    h1 { font-size: clamp(1.45rem, 3.4vw, 1.95rem); line-height: 1.2; margin: 14px 0 20px; }
    .topbar { margin-bottom: 14px; }
    .btn-levels {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.18);
      color: #cbd5e1;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-levels:hover { border-color: #64748b; }
    .folders { display: flex; flex-direction: column; gap: 10px; }
    a.folder {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--panel);
      border: 1px solid rgba(71, 85, 105, 0.55);
      border-radius: 16px;
      padding: 18px 18px 16px;
      min-height: 48px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overflow-wrap: anywhere;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    a.folder:hover { border-color: #64748b; background: #3b4a60; }
    a.folder strong { display: block; font-size: 1.18rem; line-height: 1.2; margin-bottom: 8px; }
    a.folder span { display: block; font-size: 0.95rem; color: var(--muted); line-height: 1.4; }
    a.folder .go { font-size: 0.98rem; color: var(--accent); font-weight: 700; margin-top: 8px; }
    @media (max-width: 420px) {
      h1 { font-size: 1.38rem; margin-top: 10px; }
      a.folder strong { font-size: 1.06rem; }
      a.folder span { font-size: 0.98rem; }
      a.folder .go { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="topbar">
      <a class="btn-levels" href="../index.html">&larr; Levels</a>
    </p>
    <h1>Listening Part 2 &middot; WB Track 12</h1>
    <div class="folders">
      <a class="folder" href="celtic-languages.html">
        <strong>Exam trainer</strong>
        <span>Part 2 sentence completion &middot; Celtic languages &middot; audio + gaps + key check</span>
        <div class="go">Open &rarr;</div>
      </a>
      <a class="folder" href="workbook-transcript.html">
        <strong>Workbook transcript</strong>
        <span>Read-only full script for revision</span>
        <div class="go">Open &rarr;</div>
      </a>
    </div>
  </div>
</body>
</html>
