<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit 4 Vocabulary &mdash; Films</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/mastering-b2-page-skin.css" />
  <link rel="stylesheet" href="../../css/mastering-b2-back-link.css" />
  <style>
    .film-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 8px;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #d5e2f8;
    }
    .film-row--ex {
      border-color: rgba(250, 204, 21, 0.35);
      background: rgba(250, 204, 21, 0.08);
      color: #fde68a;
    }
    .film-row.is-ok { border-color: rgba(54, 211, 153, 0.45); background: rgba(54, 211, 153, 0.08); }
    .film-row.is-bad { border-color: rgba(248, 113, 113, 0.45); background: rgba(248, 113, 113, 0.06); }
    .film-num { font-weight: 800; color: #5ec8f0; min-width: 1.6rem; }
    .film-first {
      font-weight: 800;
      font-size: 1.05rem;
      color: #fde68a;
      min-width: 1rem;
    }
    .film-rest {
      min-width: 6rem;
      max-width: 12rem;
      border: none;
      border-bottom: 2px solid #4d6fa1;
      background: transparent;
      color: #fff;
      font-size: 0.95rem;
      padding: 2px 4px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .film-rest--done {
      border-bottom-color: transparent;
      letter-spacing: 0.04em;
    }
    .film-rest:focus {
      outline: none;
      border-bottom-color: #56ccf2;
    }
    .film-rest.ok { border-bottom-color: #36d399; color: #86efac; }
    .film-rest.bad { border-bottom-color: #f87171; color: #fca5a5; }
    .film-key {
      display: inline;
      margin-left: 0.35em;
      font-weight: 800;
      font-size: 0.92em;
      color: #86efac;
      white-space: nowrap;
    }
    .film-def { color: #9bb0d3; font-size: 0.92rem; flex: 1 1 12rem; }
    .film-row--ex .film-def { color: #fef3c7; }
    .vocab-kicker {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #86efac;
      border: 1px solid rgba(134, 239, 172, 0.35);
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body data-mb2-unit="4" data-mb2-skill="vocabulary" data-mb2-ex="u4-vocab-films">
  <main class="page">
    <header class="top">
      <div>
        <span class="vocab-kicker">Vocabulary &middot; Films</span>
        <h1>Complete the words</h1>
        <p class="lead">The first letter of each word is in bold. There is an example at the beginning (0).</p>
      </div>
      <a class="back" href="../index.html">&larr; Unit 4 Vocabulary</a>
    </header>

    <p class="instr" style="color:#d5e2f8;font-size:0.94rem;margin-bottom:16px;">
      Complete the words with the missing letters. Type the rest of each word after the bold letter.
    </p>

    <div id="films-root"></div>

    <div class="vocab-btn-row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
      <button type="button" class="btn-check" id="films-check">Check answers</button>
      <button type="button" class="btn-reset" id="films-reset">Clear</button>
    </div>
    <p class="vocab-feedback" id="films-fb" role="status" aria-live="polite" style="margin-top:10px;font-size:0.9rem;"></p>
  </main>

  <script src="../../js/mastering-b2-skill-progress.js"></script>
  <script src="../../js/unit4-vocab-films.js"></script>
  <script>U4_VOCAB_FILMS.mount();</script>
  <script src="../../js/mastering-b2-daily-activity.js"></script>
  <script src="../../js/mastering-b2-exercise-auto.js"></script>
</body>
</html>
