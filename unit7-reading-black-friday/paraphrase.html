<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Friday &mdash; paraphrase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/mastering-b2-back-link.css" />
  <link rel="stylesheet" href="../css/fce-lifestyle-paraphrase.css" />
  <style>
    body {
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(180deg, #09122a 0%, #101d3c 100%);
      color: #e8f0ff;
      font-family: Manrope, "Segoe UI", system-ui, sans-serif;
    }
    .wrap { width: min(600px, 100%); margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    h1 { font-size: 1.15rem; margin: 0; }
    .tag { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; color: #86efac; margin-bottom: 6px; display: block; }
  </style>
</head>
<body data-mb2-unit="7" data-mb2-skill="reading" data-mb2-ex="u7-black-friday-paraphrase">
  <div class="wrap">
    <header class="top">
      <div>
        <span class="tag" id="personTag">Reading · Unit 7</span>
        <h1 id="pageTitle">Paraphrase · flip cards</h1>
      </div>
      <a class="back" id="backLink" href="index.html">&larr; Black Friday</a>
    </header>
    <div id="paraphrase-root"></div>
  </div>
  <script src="../js/unit7-black-friday-reading-lexis.js"></script>
  <script src="../js/unit7-black-friday-pack-data.js"></script>
  <script src="../js/unit7-black-friday-exercise-boot.js"></script>
  <script src="../js/fce-lifestyle-paraphrase-practice.js"></script>
  <script>
(function () {
  var B = window.U7_BLACK_FRIDAY_EX_BOOT;
  var P = window.U7_BLACK_FRIDAY_PACK;
  if (!B || !P) return;
  B.readingBack("backLink");
  B.applyLabels({ title: "Paraphrase · flip cards" });
  var pack = P.paraphrase();
  var vars = (pack && pack.variants) || [];
  if (window.FCE_LIFESTYLE_PARAPHRASE && vars.length) {
    FCE_LIFESTYLE_PARAPHRASE.mount({ rootId: "paraphrase-root", variants: vars, mode: "flip" });
  }
})();
  </script>
  <script src="../js/mastering-b2-skill-progress.js"></script>
  <script src="../js/mastering-b2-daily-activity.js"></script>
  <script src="../js/mastering-b2-exercise-auto.js"></script>
</body>
</html>
