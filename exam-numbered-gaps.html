<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam gaps 1–8</title>
  <style>
    :root { --bg:#0b1224; --text:#e8f0ff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
      background:linear-gradient(180deg,#060a14 0%,var(--bg) 40%);
      color:var(--text); min-height:100dvh; padding:20px 16px 32px; font-size:17px; line-height:1.55;
    }
  </style>
  <link rel="stylesheet" href="css/fce-exam-numbered-gaps.css" />
  <link rel="stylesheet" href="css/unit1-lifestyle-phrases-drawer.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/mastering-b2-page-skin.css" />
</head>
<body>
  <div id="exam-gaps-root"></div>
  <script src="js/unit1-lifestyle-exam-gaps-data.js"></script>
  <script src="js/unit1-clothes-exam-gaps-data.js"></script>
  <script src="js/unit1-lifestyle-lexis.js"></script>
  <script src="js/unit1-clothes-lexis.js"></script>
  <script src="js/fce-cool-phrases-drawer.js"></script>
  <script src="js/fce-u1-cool-phrases-bridge.js"></script>
  <script src="js/fce-exam-numbered-gaps-decks.js"></script>
  <script src="js/fce-exam-numbered-gaps-engine.js"></script>
  <script src="js/mastering-b2-daily-activity.js"></script>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var unit = parseInt(p.get("unit"), 10) || 1;
      var back = p.get("back");
      var backHref = "unit" + unit + "-class-games.html";
      var backLabel = "Class Games";
      if (back === "reading") {
        backHref = "unit1-reading/this-is-your-life/index.html";
        backLabel = "This is your life";
      } else if (back === "vocab") {
        backHref = "unit1-vocabulary/index.html";
        backLabel = "Vocabulary";
      }
      FCE_EXAM_NUMBERED_GAPS.mount({
        root: "#exam-gaps-root",
        unit: unit,
        backHref: backHref,
        backLabel: backLabel
      });
    })();
  </script>
  <script src="js/mastering-b2-skill-progress.js"></script>
  <script src="js/mastering-b2-exercise-auto.js"></script>
</body>
</html>
